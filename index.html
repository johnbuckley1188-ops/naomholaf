/* ── PUCKOUT RENDER ─────────────────────────────────────────────────────── */
function renderPuckouts(){
  const panel=document.getElementById('panel-puckouts');
  if(!teams.length){showEmpty();return;}
  const team=teams[currentViewTeam];
  const opp=teams.find(t=>t!==team)||'';
  const col=teamColors[team]||T_COLORS[currentViewTeam];
  const allRows=getActiveRows();

  function halfCol(half,halfIdx){
    const rows=getHalfRows(allRows,half);
    const s=computeStats(rows,team);
    const puckouts=s.puckoutRows;
    const DISTS=['Long','Mid','Short'];
    const zoneStats=DISTS.map(d=>{
      const dRows=puckouts.filter(r=>{const p=parsePuckoutNew(r);return p&&p.dist===d;});
      const dWon=dRows.filter(r=>{const p=parsePuckoutNew(r);return p&&p.isWon&&p.winner===team;}).length;
      const dPct=puckouts.length>0?Math.round(dRows.length/puckouts.length*100):0;
      const dWinPct=dRows.length>0?Math.round(dWon/dRows.length*100):0;
      return{d,tot:dRows.length,pct:dPct,winPct:dWinPct};
    });
    const ppId=`d-po-own-${currentViewTeam}-${half}`;
    const ptId=`d-po-tot-${currentViewTeam}-${half}`;
    const pcId=`po-canvas-${currentViewTeam}-${half}`;
    return `<div class="col-block">
      <div class="col-hd">${HALF_LABELS[halfIdx]} ${KO()}S</div>
      <div class="donut-pair">
        <div class="d-wrap">
          <canvas id="${ppId}" width="110" height="110" style="width:110px;height:110px"></canvas>
          <div class="d-lbl">OWN ${KO()}<br>WIN %</div>
        </div>
        <div class="d-wrap">
          <canvas id="${ptId}" width="110" height="110" style="width:110px;height:110px"></canvas>
          <div class="d-lbl">TOTAL ${PO()}<br>WIN %</div>
        </div>
      </div>
      <div class="po-hdr">
        <div><div class="po-hdr-lbl">TOTAL</div><div class="po-hdr-val">${s.puckouts}</div></div>
        <div><div class="po-hdr-lbl">WON CLEAN</div><div class="po-hdr-val" style="color:#1a9e4a">${s.wonClean}</div></div>
        <div><div class="po-hdr-lbl">WON BREAK</div><div class="po-hdr-val" style="color:#5dca80">${s.wonBreak}</div></div>
        <div><div class="po-hdr-lbl">ERROR</div><div class="po-hdr-val" style="color:#888888">${s.poError}</div></div>
      </div>
      <div class="pitch-wrap" style="margin-top:8px">
        <div class="pitch-container pitch-single">
          <img class="pitch-bg" src="${IMG_FULL}" alt="pitch">
          <canvas class="pitch-overlay" id="${pcId}"></canvas>
        </div>
      </div>
      <div style="width:62%;margin:4px auto 0">
        <table class="zone-tbl">
          <thead><tr><th>ZONE</th><th>TOTAL</th><th>%</th><th>WIN %</th></tr></thead>
          <tbody>${zoneStats.map(z=>`<tr><td>${z.d.toUpperCase()}</td><td>${z.tot}</td><td>${z.pct}%</td><td>${z.winPct}%</td></tr>`).join('')}</tbody>
        </table>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;padding:6px 8px;justify-content:center;border-top:1px solid rgba(100,130,200,.08);margin-top:4px">
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:#B0C4DC;display:flex;align-items:center;gap:5px"><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:#1a9e4a;flex-shrink:0"></span>Won Clean</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:#B0C4DC;display:flex;align-items:center;gap:5px"><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:#5dca80;flex-shrink:0"></span>Won Break</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:#B0C4DC;display:flex;align-items:center;gap:5px"><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:#c94040;flex-shrink:0"></span>Lost</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:#B0C4DC;display:flex;align-items:center;gap:5px"><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:#7a0000;flex-shrink:0"></span>Lost Clean</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:#B0C4DC;display:flex;align-items:center;gap:5px"><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:#222222;border:1px solid #666;flex-shrink:0"></span>Error</span>
      </div>
    </div>`;
  }

  const poSwitcher=teams.length>=2?`<div class="team-switcher">${teams.map((t,i)=>{const c=teamColors[t]||T_COLORS[i];const act=i===currentViewTeam;return`<button class="tsw-btn${act?' active':''}" style="${act?`border-bottom-color:${c};color:${c}`:''}" onclick="setTabAndTeam('puckouts',${i})">${t.toUpperCase()}</button>`;}).join('')}</div>`:'';
  const poHeatToggle=`<div style="display:flex;justify-content:center;gap:6px;padding:4px 0 2px"><button onclick="setPitchViewMode('puckouts','dots')" style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;padding:3px 12px;border-radius:3px;border:1px solid ${pitchViewMode.puckouts==='dots'?'#4A7CCC':'rgba(100,130,200,0.3)'};background:${pitchViewMode.puckouts==='dots'?'rgba(74,124,204,0.2)':'transparent'};color:${pitchViewMode.puckouts==='dots'?'#FFFFFF':'#6A80A8'};cursor:pointer">DOTS</button><button onclick="setPitchViewMode('puckouts','heat')" style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;padding:3px 12px;border-radius:3px;border:1px solid ${pitchViewMode.puckouts==='heat'?'#4A7CCC':'rgba(100,130,200,0.3)'};background:${pitchViewMode.puckouts==='heat'?'rgba(74,124,204,0.2)':'transparent'};color:${pitchViewMode.puckouts==='heat'?'#FFFFFF':'#6A80A8'};cursor:pointer">HEAT</button></div>`;
  // Collect rows that look like puckout rows but failed to parse, or parsed as Unknown/Error
  const allPORows=allRows.filter(r=>r.Row&&/\s+Puckout\*?$/.test(r.Row));
  const poParseErrors=allPORows.filter(r=>{
    const ko=(r['03. Kickouts']||'').trim();
    const seq=(r['09. Start Sequence']||'').trim();
    const ao=(r['08. Attack Outcome']||'').trim();
    if(!ko&&!seq&&!ao)return false; // empty row, ignore
    const p=parsePuckoutNew(r);
    // Show: completely unparseable rows and unknown outcome only
    // ErrorLost is a valid parsed outcome (puckout lost to unnamed opponent) — do not flag it
    return !p||p.outcome==='Unknown';
  });
  const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const poErrorSection=poParseErrors.length>0?`<details style="margin:8px 12px 4px;border:1px solid rgba(249,115,22,.35);border-radius:6px;background:rgba(249,115,22,.06)"><summary style="cursor:pointer;padding:8px 12px;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1.5px;color:#F97316;list-style:none;display:flex;align-items:center;gap:7px;user-select:none"><span style="font-size:15px">⚠</span><span>${poParseErrors.length} ${KO()} ROW${poParseErrors.length>1?'S':''} COULD NOT BE PARSED — click to inspect</span></summary><div style="padding:4px 8px 10px;overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-family:'Barlow Condensed',sans-serif;font-size:11px;color:#B0C4DC"><thead><tr style="border-bottom:1px solid rgba(100,130,200,.2)"><th style="text-align:left;padding:3px 6px;color:#6A80A8;white-space:nowrap">ROW</th><th style="text-align:left;padding:3px 6px;color:#6A80A8;white-space:nowrap">TIME</th><th style="text-align:left;padding:3px 6px;color:#6A80A8;white-space:nowrap">03. KICKOUTS</th><th style="text-align:left;padding:3px 6px;color:#6A80A8;white-space:nowrap">09. START SEQ</th><th style="text-align:left;padding:3px 6px;color:#6A80A8;white-space:nowrap">08. ATTACK</th></tr></thead><tbody>${poParseErrors.map((r,i)=>`<tr style="border-bottom:1px solid rgba(100,130,200,.07);background:${i%2?'transparent':'rgba(249,115,22,.04)'}"><td style="padding:3px 6px;white-space:nowrap">${esc(r.Row)}</td><td style="padding:3px 6px;white-space:nowrap">${esc(r['01. Time']||r['Time']||'')}</td><td style="padding:3px 6px;max-width:220px;word-break:break-word">${esc(r['03. Kickouts'])}</td><td style="padding:3px 6px;max-width:220px;word-break:break-word">${esc(r['09. Start Sequence'])}</td><td style="padding:3px 6px;max-width:160px;word-break:break-word">${esc(r['08. Attack Outcome'])}</td></tr>`).join('')}</tbody></table></div></details>`:'';
  panel.innerHTML=`<div class="print-hdr" id="ph-puckouts"></div>`+poSwitcher+poHeatToggle+
    `<div class="three-col">${HALVES.map((h,i)=>halfCol(h,i)).join('')}</div>`+poErrorSection;
  injectPrintHeader('ph-puckouts',KO()+'S — '+team);
  updateSidebarViewTeam();

  setTimeout(()=>{
    HALVES.forEach(half=>{
      const rows=getHalfRows(allRows,half);
      const s=computeStats(rows,team);
      const c1=document.getElementById(`d-po-own-${currentViewTeam}-${half}`);
      const c2=document.getElementById(`d-po-tot-${currentViewTeam}-${half}`);
      if(c1){const{ctx,w,h}=setupCanvas(c1);drawDonut(ctx,w/2,h/2,Math.min(w,h)*0.40,s.ownBallPct,col);}
      if(c2){const{ctx,w,h}=setupCanvas(c2);drawDonut(ctx,w/2,h/2,Math.min(w,h)*0.40,s.totalPOPct,'#D4A820');}
      const pc=document.getElementById(`po-canvas-${currentViewTeam}-${half}`);
      drawPuckoutOverlay(pc,s.puckoutRows,team,half,pitchViewMode.puckouts);
    });
  },60);
}

/* ── TURNOVERS RENDER ───────────────────────────────────────────────────── */
function renderTurnovers(){
  const panel=document.getElementById('panel-turnovers');
  if(!teams.length){showEmpty();return;}
  const team=teams[currentViewTeam];
  const col=teamColors[team]||T_COLORS[currentViewTeam];
  const allRows=getActiveRows();

  function halfCol(half,halfIdx){
    const rows=getHalfRows(allRows,half);
    const s=computeStats(rows,team);
    const dfId=`d-to-forced-${currentViewTeam}-${half}`;
    const dsId=`d-to-scor-${currentViewTeam}-${half}`;
    const pcId=`to-canvas-${currentViewTeam}-${half}`;
    const toRows=s.toRows;
    const typeCounts={};
    ['Puck Pass','Hand Pass','Tackles','Shots','5050','Set Piece','Handling'].forEach(t=>{
      typeCounts[t]=toRows.filter(r=>parseTurnoverMeta(r.Ungrouped||'').type===t).length;
    });
    // Zone counts for turnovers and frees
    const getY=r=>{const v=firstNum(r.Y);return v===null?-1:v;};
    const toZ0=s.toRows.filter(r=>getY(r)>=0&&getY(r)<=45).length;
    const toZ1=s.toRows.filter(r=>getY(r)>45&&getY(r)<=95).length;
    const toZ2=s.toRows.filter(r=>getY(r)>95).length;
    const freeBnd=(currentSport==='hurling')?75:45;
    const freDanger=s.freeConRows.filter(r=>getY(r)>=0&&getY(r)<=freeBnd).length;
    const freSafe=s.freeConRows.filter(r=>getY(r)>freeBnd).length;
    // Sport-aware TO type labels
    const toLabel=(t)=>{
      if(t==='Puck Pass')return currentSport==='hurling'?'PUCK':'KICK';
      if(t==='Hand Pass')return'HAND PASS';
      if(t==='Tackles')return'TACKLE';
      if(t==='Shots')return'SHOTS';
      if(t==='Set Piece')return'SET PIECE';
      if(t==='Handling')return'CARRY';
      if(t==='5050')return'5050';
      return t.toUpperCase();
    };
    // Frees zone flex proportions
    const freeSafeFlex=(currentSport==='hurling')?65:95;
    const freDangerFlex=(currentSport==='hurling')?75:45;
    // Zone sidebar style helpers
    const zN='font-family:\'Barlow Condensed\',sans-serif;font-weight:900;font-size:20px;line-height:1.1';
    const zL='font-family:\'Barlow Condensed\',sans-serif;font-size:10px;color:#6A80A8;letter-spacing:.3px;margin-top:2px;line-height:1.2';
    const sidebarCell=(count,label,bg,border,textCol,align,flexVal=1)=>`
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 5px;background:${bg};border-${align==='flex-end'?'right':'left'}:3px solid ${border};flex:${flexVal};text-align:center">
        <div style="${zN};color:${textCol}">${count}</div>
        <div style="${zL};text-align:center">${label}</div>
      </div>`;
    return `<div class="col-block">
      <div class="col-hd">${HALF_LABELS[halfIdx]}</div>
      <div class="donut-pair">
        <div class="d-wrap">
          <canvas id="${dfId}" width="110" height="110" style="width:110px;height:110px"></canvas>
          <div class="d-lbl">FORCED<br>TURNOVERS</div>
        </div>
        <div class="d-wrap">
          <canvas id="${dsId}" width="110" height="110" style="width:110px;height:110px"></canvas>
          <div class="d-lbl">SCORABLE<br>FREES CON</div>
        </div>
      </div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:1.5px;color:#FFFFFF;text-transform:uppercase;text-align:center;padding:4px 0;border-top:1px solid rgba(100,130,200,.1)">TURNOVER TYPE</div>
      <div class="to-types">
        ${Object.entries(typeCounts).map(([t,v])=>`<div class="to-type"><div class="to-type-v">${v}</div><div class="to-type-l">${toLabel(t)}</div></div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px 8px;font-family:'Barlow Condensed',sans-serif;border-top:1px solid rgba(100,130,200,.1)">
        <span style="color:#FFFFFF;font-weight:900;font-size:17px">${s.toLost} TURNOVERS</span>
        <span style="color:#FFFFFF;font-weight:900;font-size:17px;text-align:right">${s.freeCon} FREES CON</span>
      </div>
      <div style="display:flex;align-items:stretch;padding:3px 4px 2px;gap:0">
        <!-- TO zone sidebar (left) -->
        <div style="display:flex;flex-direction:column;flex-shrink:0;width:52px;overflow:hidden;border-radius:3px 0 0 3px;align-self:stretch">
          ${sidebarCell(toZ2,'96–140','rgba(46,204,113,0.30)','#2ECC71','#2ECC71','flex-end',45)}
          ${sidebarCell(toZ1,'46–95','rgba(249,115,22,0.30)','#F97316','#F97316','flex-end',50)}
          ${sidebarCell(toZ0,'0–45','rgba(231,76,60,0.30)','#E74C3C','#E74C3C','flex-end',45)}
        </div>
        <!-- Pitch -->
        <div class="pitch-container" style="flex:1;min-width:0;max-width:65%">
          <img class="pitch-bg" src="${IMG_FULL}" alt="pitch">
          <canvas class="pitch-overlay" id="${pcId}"></canvas>
        </div>
        <!-- Frees zone sidebar (right) -->
        <div style="display:flex;flex-direction:column;flex-shrink:0;width:52px;overflow:hidden;border-radius:0 3px 3px 0;align-self:stretch">
          ${sidebarCell(freSafe,'NON SCORABLE','rgba(46,204,113,0.30)','#2ECC71','#2ECC71','flex-start',(currentSport==='hurling'?65:95))}
          ${sidebarCell(freDanger,'SCORABLE','rgba(231,76,60,0.30)','#E74C3C','#E74C3C','flex-start',(currentSport==='hurling'?75:45))}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:2px 6px 4px;font-family:'Barlow Condensed',sans-serif;font-size:10px;color:#6A80A8;text-align:center">
        <div style="font-weight:700">TURNOVERS</div>
        <div style="font-weight:700">FREES CONCEDED</div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;padding:3px 8px 5px;justify-content:center;border-top:1px solid rgba(100,130,200,.08)">
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:#B0C4DC;display:flex;align-items:center;gap:5px"><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:#1A3A6E;border:1px solid rgba(100,160,255,0.5);flex-shrink:0"></span>TURNOVERS</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:#B0C4DC;display:flex;align-items:center;gap:5px"><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:#E74C3C;flex-shrink:0"></span>FREES CON</span>
      </div>
    </div>`;
  }

  const toSwitcher=teams.length>=2?`<div class="team-switcher">${teams.map((t,i)=>{const c=teamColors[t]||T_COLORS[i];const act=i===currentViewTeam;return`<button class="tsw-btn${act?' active':''}" style="${act?`border-bottom-color:${c};color:${c}`:''}" onclick="setTabAndTeam('turnovers',${i})">${t.toUpperCase()}</button>`;}).join('')}</div>`:'';
  const toHeatToggle=`<div style="display:flex;justify-content:center;gap:6px;padding:4px 0 2px"><button onclick="setPitchViewMode('turnovers','dots')" style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;padding:3px 12px;border-radius:3px;border:1px solid ${pitchViewMode.turnovers==='dots'?'#4A7CCC':'rgba(100,130,200,0.3)'};background:${pitchViewMode.turnovers==='dots'?'rgba(74,124,204,0.2)':'transparent'};color:${pitchViewMode.turnovers==='dots'?'#FFFFFF':'#6A80A8'};cursor:pointer">DOTS</button><button onclick="setPitchViewMode('turnovers','heat')" style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;padding:3px 12px;border-radius:3px;border:1px solid ${pitchViewMode.turnovers==='heat'?'#4A7CCC':'rgba(100,130,200,0.3)'};background:${pitchViewMode.turnovers==='heat'?'rgba(74,124,204,0.2)':'transparent'};color:${pitchViewMode.turnovers==='heat'?'#FFFFFF':'#6A80A8'};cursor:pointer">HEAT</button></div>`;
  panel.innerHTML=`<div class="print-hdr" id="ph-turnovers"></div>`+toSwitcher+toHeatToggle+
    `<div class="three-col">${HALVES.map((h,i)=>halfCol(h,i)).join('')}</div>`;
  injectPrintHeader('ph-turnovers','TURNOVERS — '+team);
  updateSidebarViewTeam();

  setTimeout(()=>{
    HALVES.forEach(half=>{
      const rows=getHalfRows(allRows,half);
      const s=computeStats(rows,team);
      const c1=document.getElementById(`d-to-forced-${currentViewTeam}-${half}`);
      const c2=document.getElementById(`d-to-scor-${currentViewTeam}-${half}`);
      if(c1){const{ctx,w,h}=setupCanvas(c1);drawDonut(ctx,w/2,h/2,Math.min(w,h)*0.38,s.forcedPct,col);}
      if(c2){const{ctx,w,h}=setupCanvas(c2);drawDonut(ctx,w/2,h/2,Math.min(w,h)*0.38,s.scorablePct,col);}
      const pc=document.getElementById(`to-canvas-${currentViewTeam}-${half}`);
      drawTurnoverOverlay(pc,s.toRows,s.freeConRows,half,col,pitchViewMode.turnovers);
    });
  },60);
}

/* ── SIDEBAR VIEW TEAM (kept for compat, now hidden) ────────────────────── */
function updateSidebarViewTeam(){
  // Legacy function — per-team tabs now handled by updateSidebarTabs()
  const section=document.getElementById('sb-viewteam-section');
  if(section)section.style.display='none';
}

/* ── PER-TEAM SIDEBAR TABS ──────────────────────────────────────────────── */
function updateSidebarTabs(){
  const cats=['puckouts','shooting','turnovers'];
  const koWord=currentSport==='hurling'?'Puckouts':'Kickouts';
  const catLabels={puckouts:koWord,shooting:'Shooting',turnovers:'Turnovers'};
  if(teams.length<2){
    cats.forEach(cat=>[0,1].forEach(i=>{const b=document.getElementById('sb-teamtab-'+cat+'-'+i);if(b)b.style.display='none';}));
    return;
  }
  cats.forEach(cat=>{
    [0,1].forEach(i=>{
      const btn=document.getElementById('sb-teamtab-'+cat+'-'+i);
      if(!btn)return;
      btn.style.display='';
      btn.textContent=(teams[i]||'Team '+(i+1))+' '+catLabels[cat];
      btn.classList.toggle('active',currentTab===cat&&currentViewTeam===i);
    });
  });
}

function setTabAndTeam(tab,teamIdx){
  currentTab=tab;
  currentViewTeam=teamIdx;
  // Sync nav items and pills
  document.querySelectorAll('.tab-btn,.filter-pill[data-tab],.nav-item[data-tab]').forEach(b=>{
    const teamMatch=b.dataset.team!==undefined?parseInt(b.dataset.team)===teamIdx:true;
    b.classList.toggle('active',b.dataset.tab===tab&&teamMatch);
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+tab));
  updateMatchBanner();
  updateMobileHeader();
  updateMobileNav();
  updateSidebarTabs();
  closeSidebar();
  if(tab==='puckouts')renderPuckouts();
  else if(tab==='shooting')renderShooting();
  else if(tab==='turnovers')renderTurnovers();
  else if(tab==='momentum')renderMomentum();
}

/* ── PRINT HEADER HELPER ────────────────────────────────────────────────── */
function injectPrintHeader(id,title){
  const el=document.getElementById(id);
  if(!el||!teams.length)return;
  const rows=getActiveRows();
  const s0=calcScore(rows,teams[0]),s1=calcScore(rows,teams[1]);
  const c0=teamColors[teams[0]]||T_COLORS[0];
  const c1=teamColors[teams[1]]||T_COLORS[1];
  el.innerHTML=`
    <span class="print-hdr-team" style="color:${c0}">${teams[0]}</span>
    <div style="text-align:center">
      <div class="print-hdr-title">${title}</div>
      <div class="print-hdr-score">${s0.G}-${String(s0.P).padStart(2,'0')} (${s0.total}) <span style="color:#4A5F88">vs</span> ${s1.G}-${String(s1.P).padStart(2,'0')} (${s1.total})</div>
    </div>
    <span class="print-hdr-team" style="color:${c1}">${teams[1]}</span>`;
}

/* ── RENDER ALL ─────────────────────────────────────────────────────────── */
function renderAll(){
  const rows=getActiveRows();
  if(!rows.length){showEmpty();return;}
  updateSidebarTeams(rows);
  updateMatchBanner();
  updateMobileHeader();
  updateMobileNav();
  updateSidebarViewTeam();
  updateSidebarTabs();
  renderTeamStats();
  if(currentTab==='home')renderHome();
  else if(currentTab==='puckouts')renderPuckouts();

  else if(currentTab==='turnovers')renderTurnovers();
  else if(currentTab==='momentum')renderMomentum();
  else if(currentTab==='momstats')renderMomStats();
  else if(currentTab==='analyst')renderAnalyst();
}

/* ── NAV ────────────────────────────────────────────────────────────────── */
function setTab(tab){
  currentTab=tab;

  if((tab==='puckouts'||tab==='shooting'||tab==='turnovers')&&(currentViewTeam===undefined||currentViewTeam===null||currentViewTeam<0))currentViewTeam=0;
  // Sync sidebar nav items and legacy pills
  document.querySelectorAll('.tab-btn,.filter-pill[data-tab],.nav-item[data-tab]').forEach(b=>{

    b.classList.toggle('active',b.dataset.tab===tab&&teamMatch);
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+tab));
  updateMatchBanner();
  updateMobileHeader();
  updateMobileNav();
  updateSidebarTabs();
  closeSidebar();
  if(tab==='home')renderHome();
  else if(tab==='puckouts')renderPuckouts();
  else if(tab==='shooting')renderShooting();
  else if(tab==='turnovers')renderTurnovers();
  else if(tab==='momentum')renderMomentum();
  else if(tab==='momstats')renderMomStats();
  else if(tab==='trends')renderTrends();
  else if(tab==='analyst')renderAnalyst();

/* ── MOBILE UI ──────────────────────────────────────────────────────────── */
function toggleSidebar(){
  document.querySelector('.sidebar').classList.toggle('mob-open');
  document.getElementById('sb-backdrop').classList.toggle('mob-open');
}
function closeSidebar(){
  document.querySelector('.sidebar').classList.remove('mob-open');
  document.getElementById('sb-backdrop').classList.remove('mob-open');
}
function updateMobileHeader(){
  const titleEl=document.getElementById('mob-hdr-title');
  const dotEl=document.getElementById('mob-hdr-dot');
  if(!titleEl)return;
  const tabNames={home:'HOME',teamstats:'TEAM STATS',puckouts:KO()+'S',shooting:'SHOOTING',turnovers:'TURNOVERS',momentum:'MOMENTUM',momstats:'TIME STATS',trends:'TRENDS',analyst:'AI ANALYST'};
  const tabLabel=tabNames[currentTab]||currentTab.toUpperCase();
  if(!teams.length||currentTab==='home'){
    titleEl.textContent=typeof DASHBOARD_LABEL!=='undefined'?DASHBOARD_LABEL:'GAA ANALYTICS';
    if(dotEl)dotEl.style.background='transparent';
    return;
  }
  if(currentTab==='teamstats'||currentTab==='momentum'||currentTab==='momstats'||currentTab==='trends'){
    // Show "Team A vs Team B"
    titleEl.textContent=teams.length>=2?teams[0]+' v '+teams[1]:tabLabel;
  } else {
    const team=teams[currentViewTeam]||'';
    titleEl.textContent=team?team+' · '+tabLabel:tabLabel;
  }
  if(dotEl){
    const col=teams[currentViewTeam]?(teamColors[teams[currentViewTeam]]||T_COLORS[currentViewTeam]):'transparent';
    dotEl.style.background=teams.length?col:'transparent';
  }
}
function updateMobileNav(){
  const tabIds=['home','teamstats','puckouts','shooting','turnovers','momentum','momstats','analyst'];
  tabIds.forEach(t=>{
    const btn=document.getElementById('mob-tab-'+t);
    if(btn)btn.classList.toggle('active',t===currentTab);
  });
  const koLbl=document.getElementById('mob-lbl-puckouts');
  if(koLbl)koLbl.textContent=currentSport==='hurling'?'Puckouts':'Kickouts';
}
function switchTeam(idx,tab){
  currentViewTeam=idx;
  updateMatchBanner();
  updateSidebarTabs();
  if(tab==='puckouts')renderPuckouts();
  else if(tab==='shooting')renderShooting();
  else if(tab==='turnovers')renderTurnovers();
}

/* ── SWAP TEAMS ─────────────────────────────────────────────────────────── */
function swapTeams(){
  if(teams.length<2)return;
  [teams[0],teams[1]]=[teams[1],teams[0]];
  [T_COLORS[0],T_COLORS[1]]=[T_COLORS[1],T_COLORS[0]];
  teamColors={[teams[0]]:T_COLORS[0],[teams[1]]:T_COLORS[1]};
  currentViewTeam=0;
  updateMatchBanner();
  renderAll();
}

}

/* ── FILE HANDLING ──────────────────────────────────────────────────────── */
function handleFiles(files){
  if(!window._aoIsAdmin){return;} // upload restricted to admin
  [...files].forEach(file=>{
    const reader=new FileReader();
    reader.onload=async e=>{
      const text=e.target.result;
      const rows=parseFile(text,file.name);
      if(!rows.length){alert('No data found in "'+file.name+'". Check it is a Sportscode CSV or XML export.');return;}
      const now=Date.now();
      const existing=games.findIndex(g=>g.name===file.name);
      if(existing>=0)games[existing]={name:file.name,rows,uploadedAt:games[existing].uploadedAt||now};
      else games.push({name:file.name,rows,uploadedAt:now});
      // Update UI immediately from memory — applySelectionAndRender handles multi-game team detection
      updateStoredFilesList(games);
      applySelectionAndRender();
      // Now save to shared db and show result on the file row
      const result=await _saveGameToDB(file.name,rows,now);
      _updateFileDbStatus(file.name,result);
    };
    reader.readAsText(file);
  });
}

function _updateFileDbStatus(name,result){
  // Find the file row in the stored files list and update its status icon
  const list=document.getElementById('stored-files-list');
  if(!list)return;
  const rows=list.querySelectorAll('.stored-file-row');
  rows.forEach(row=>{
    const lbl=row.querySelector('.stored-file-name');
    if(lbl&&lbl.textContent===name){
      const status=row.querySelector('.stored-file-status');
      if(status){
        if(!result){status.textContent='(no db)';status.style.color='#8A9AB0';}
        else if(result.ok){status.textContent='✓ shared';status.style.color='#50D080';}
        else{status.textContent='✗ not shared';status.style.color='#E07070';status.title=result.error||'';
          alert(result.error||'Failed to save to shared storage.');}
      }
    }
  });
}

/* ── AI ANALYST ─────────────────────────────────────────────────────────── */
function _buildMatchContext(){
  const rows=getActiveRows();
  if(!rows.length)return null;
  const activeGames=selectedGames.size===0?games:games.filter((_,i)=>selectedGames.has(i));
  const gameNames=activeGames.map(g=>g.name.replace(/\.(csv|xml)$/i,'')).join(', ');
  const sport=currentSport==='hurling'?'Hurling':'Football';
  const t0=teams[0]||'Team A';
  const t1=teams[1]==='Opposition'?oppositionTeamNames.join(' / '):teams[1]||'Team B';

  function fmtScore(s){return s?`${s.G}-${String(s.P).padStart(2,'0')} (${s.total} pts)`:'N/A';}
  function statsBlock(label,filterRows){
    if(!filterRows||!filterRows.length)return`${label}: no data\n`;
    const s0=computeStats(filterRows,teams[0]);const s1=computeStats(filterRows,teams[1]);
    const sc0=calcScore(filterRows,teams[0]);const sc1=calcScore(filterRows,teams[1]);
    // computeStats fields: puckouts=total, ownWon=won, totalShots, scores, possSecs, bipSecs, toLost, playWide+freeWide=wides
    const po0=s0.puckouts,po1=s1.puckouts;
    const pw0=s0.ownWon,pw1=s1.ownWon;
    const sh0=s0.totalShots,sh1=s1.totalShots;
    const sc0t=s0.scores,sc1t=s1.scores;
    const poss0=s0.possSecs,poss1=s1.possSecs;
    const w0=s0.playWide+s0.freeWide,w1=s1.playWide+s1.freeWide;
    return `${label}:
  Score: ${t0} ${fmtScore(sc0)} | ${t1} ${fmtScore(sc1)}
  Possession: ${poss0||poss1?`${t0} ${s0.posPct}% | ${t1} ${s1.posPct}%`:'N/A'}
  ${sport==='Hurling'?'Puckouts':'Kickouts'}: ${t0} ${pw0}/${po0} won (${po0?Math.round(pw0/po0*100):0}%) | ${t1} ${pw1}/${po1} won (${po1?Math.round(pw1/po1*100):0}%)
  Shots: ${t0} ${sc0t}/${sh0} (${sh0?Math.round(sc0t/sh0*100):0}% conversion) | ${t1} ${sc1t}/${sh1} (${sh1?Math.round(sc1t/sh1*100):0}% conversion)
  Wides: ${t0} ${w0} | ${t1} ${w1}
  Turnovers conceded: ${t0} ${s0.toLost} | ${t1} ${s1.toLost}
  From play - Goals: ${t0} ${s0.playGoals} | ${t1} ${s1.playGoals}; Points: ${t0} ${s0.playPts} | ${t1} ${s1.playPts}
  Dead ball - Goals: ${t0} ${s0.freeGoals} | ${t1} ${s1.freeGoals}; Points: ${t0} ${s0.freePts} | ${t1} ${s1.freePts}
`;
  }

  const allH1=rows.filter(r=>String(r.Half||r.Period||'').replace(/\s+/g,'').toLowerCase()==='1sthalf'||String(r.Half||r.Period||'')===('1'));
  const allH2=rows.filter(r=>String(r.Half||r.Period||'').replace(/\s+/g,'').toLowerCase()==='2ndhalf'||String(r.Half||r.Period||'')===('2'));

  return `You are an expert GAA match analyst assistant. Answer questions based ONLY on the data below. Be concise, specific, and use numbers. If data is unavailable say so.

SPORT: ${sport}
DASHBOARD: ${document.title||'GAA Analytics'}
GAME(S): ${gameNames}
TEAMS: ${t0} (home/primary) vs ${t1} (opposition)

${statsBlock('FULL GAME',rows)}
${allH1.length?statsBlock('FIRST HALF',allH1):''}${allH2.length?statsBlock('SECOND HALF',allH2):''}
Note: ${t1==='Opposition'||t1.includes('/')?"Stats for opposition combine data across multiple opponents.":'Single game.'}`;
}

/* ── TRENDS RENDER ──────────────────────────────────────────────────────── */
let _trendsShowOpp=false;
function renderTrends(){
  const panel=document.getElementById('panel-trends');
  if(!panel)return;
  if(games.length<1){
    panel.innerHTML='<div class="trends-empty">Load game files to see trends</div>';
    return;
  }
  const homeTeam=teams[0]||'';
  const c0=homeTeam?(teamColors[homeTeam]||T_COLORS[0]):'#6699FF';
  // Sort all games by date ascending
  const sortedGames=[...games].sort((a,b)=>{
    const da=gameDate(a)||new Date(0),db=gameDate(b)||new Date(0);
    return da-db;
  });
  // Puckout distance win % helper
  function distWinPct(dist,poRows){
    const total=poRows.filter(r=>{const p=parsePuckoutNew(r);return p&&p.dist===dist;}).length;
    const won=poRows.filter(r=>{const p=parsePuckoutNew(r);return p&&p.dist===dist&&p.isWon;}).length;
    return total>=2?Math.round(won/total*100):null;
  }
  function rollingAvg(arr,n){
    return arr.map((_,i)=>{
      const sl=arr.slice(Math.max(0,i-n+1),i+1).filter(v=>v!==null);
      return sl.length?Math.round(sl.reduce((a,b)=>a+b,0)/sl.length*10)/10:null;
    });
  }
  // Pre-compute per-game stats + labels
  const gameData=sortedGames.map(g=>{
    const d=gameDate(g);
    const dateLbl=d?d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
    const s0=homeTeam?computeStats(g.rows,homeTeam):null;
    // detect opponent for this specific game
    const allT=detectAllTeams(g.rows);
    const oppForGame=allT.find(t=>t!==homeTeam)||'';
    const c1opp=oppForGame?(teamColors[oppForGame]||T_COLORS[1]):'#FF6644';
    const s1=oppForGame?computeStats(g.rows,oppForGame):null;
    return{oppName:oppForGame,dateLbl,s0,s1,c1opp};
  });
  // Section definitions
  const KOL=KO();
  const SECTIONS=[
    {lbl:'SHOOTING',grid:3,metrics:[
      {key:'fromPlay',label:'From Play %',unit:'%',pct:true,fn:s=>s.fromPlayConv},
      {key:'fromFree',label:'From Free %',unit:'%',pct:true,fn:s=>s.deadBallConv},
      {key:'totalConv',label:'Total Shooting %',unit:'%',pct:true,fn:s=>s.totalConv},
    ]},
    {lbl:'ATTACKING',grid:3,metrics:[
      {key:'attacks',label:'Attacks',unit:'',fn:s=>s.attacks},
      {key:'shots',label:'Shots',unit:'',fn:s=>s.sfPlay},
      {key:'scores',label:'Scores',unit:'',fn:s=>s.scores},
    ]},
    {lbl:'DISCIPLINE',grid:3,metrics:[
      {key:'turnovers',label:'Turnovers Lost',unit:'',fn:s=>s.toLost},
      {key:'freesCon',label:'Frees Conceded',unit:'',fn:s=>s.freeCon},
      {key:'scorable',label:'Scorable Frees %',unit:'%',pct:true,fn:s=>s.scorablePct},
    ]},
    {lbl:KOL+'S',grid:2,metrics:[
      {key:'ownBall',label:'Own Ball %',unit:'%',pct:true,fn:s=>s.ownBallPct},
      {key:'totalPO',label:'Total '+(KOL[0]+KOL.slice(1).toLowerCase())+'s %',unit:'%',pct:true,fn:s=>s.totalPOPct},
    ]},
    {lbl:KOL+' DISTANCE',grid:3,metrics:[
      {key:'poLong',label:'Long %',unit:'%',pct:true,fn:s=>distWinPct('Long',s.puckoutRows)},
      {key:'poMid',label:'Mid %',unit:'%',pct:true,fn:s=>distWinPct('Mid',s.puckoutRows)},
      {key:'poShort',label:'Short %',unit:'%',pct:true,fn:s=>distWinPct('Short',s.puckoutRows)},
    ]},
  ];
  // Flatten all metrics with section/idx info for canvas IDs
  let canvasIdx=0;
  const allMetricEntries=[];
  SECTIONS.forEach(sec=>{
    sec.metrics.forEach(m=>{allMetricEntries.push({sec,m,cidx:canvasIdx++});});
  });
  // Determine if opp toggle should show (do any games have a clear opponent?)
  const hasOpp=gameData.some(g=>g.oppName);
  // Determine a label for "show opposition" — use most common opp
  const oppCounts={};
  gameData.forEach(g=>{if(g.oppName)oppCounts[g.oppName]=(oppCounts[g.oppName]||0)+1;});
  const primaryOpp=Object.entries(oppCounts).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Opposition';
  // Build HTML
  function sectionHTML(sec,secStart){
    const gridClass=sec.grid===2?'trends-grid-2':'trends-grid';
    return`<div class="trends-section">
      <div class="trends-section-lbl">${sec.lbl}</div>
      <div class="${gridClass}">
        ${sec.metrics.map((m,mi)=>{
          const cidx=secStart+mi;
          return`<div class="trends-card">
            <div class="trends-card-title">${m.label}</div>
            <canvas class="trends-canvas" id="trc-${cidx}"></canvas>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  let secStart=0;
  const sectionsHTML=SECTIONS.map(sec=>{
    const h=sectionHTML(sec,secStart);
    secStart+=sec.metrics.length;
    return h;
  }).join('');
  panel.innerHTML=`
    <div class="trends-header">
      <div class="trends-header-title">TRENDS</div>
      ${hasOpp?`<label class="trends-opp-toggle">
        <input type="checkbox" ${_trendsShowOpp?'checked':''} onchange="_trendsShowOpp=this.checked;renderTrends()">
        <span>Show Opposition</span>
      </label>`:''}
    </div>
    <div class="trends-body" id="trends-body">
      ${sectionsHTML}
    </div>`;
  // Draw all canvases after layout
  requestAnimationFrame(()=>{
    allMetricEntries.forEach(({m,cidx})=>{
      const canvas=document.getElementById('trc-'+cidx);
      if(!canvas)return;
      const dpr=window.devicePixelRatio||1;
      const W=canvas.offsetWidth||200, H=canvas.offsetHeight||110;
      canvas.width=W*dpr; canvas.height=H*dpr;
      const ctx=canvas.getContext('2d');
      ctx.scale(dpr,dpr);
      const vals0=gameData.map(g=>g.s0?m.fn(g.s0):null);
      const vals1=gameData.map(g=>g.s1?m.fn(g.s1):null);
      const avg0=rollingAvg(vals0,3);
      const avg1=_trendsShowOpp?rollingAvg(vals1,3):[];
      const showVals=[...vals0,...(_trendsShowOpp?vals1:[]),...avg0,...(_trendsShowOpp?avg1:[])].filter(v=>v!==null);
      if(!showVals.length){
        ctx.fillStyle=themeVal('rgba(255,255,255,.2)','rgba(0,0,0,.3)');
        ctx.font=`9px 'Inter',sans-serif`;ctx.textAlign='center';
        ctx.fillText('No data',W/2,H/2);
        return;
      }
      const PAD={top:14,right:8,bottom:46,left:30};
      const cw=W-PAD.left-PAD.right, ch=H-PAD.top-PAD.bottom;
      const rawMin=Math.min(...showVals), rawMax=Math.max(...showVals);
      const spread=Math.max(rawMax-rawMin,4);
      const yMin=Math.max(0,rawMin-spread*0.15);
      const yMax=m.pct?100:rawMax+spread*0.15;
      const n=gameData.length;
      const xOf=i=>PAD.left+(n>1?i/(n-1):0.5)*cw;
      const yOf=v=>PAD.top+ch-((v-yMin)/(yMax-yMin||1))*ch;
      // Grid lines
      ctx.strokeStyle=themeVal('rgba(255,255,255,.07)','rgba(0,0,0,.08)');ctx.lineWidth=1;
      ctx.font=`8px 'Inter',sans-serif`;ctx.fillStyle=themeVal('rgba(255,255,255,.35)','rgba(0,0,0,.45)');ctx.textAlign='right';
      [0,.5,1].forEach(t=>{
        const val=yMin+(yMax-yMin)*t;
        const y=yOf(val);
        ctx.beginPath();ctx.moveTo(PAD.left,y);ctx.lineTo(W-PAD.right,y);ctx.stroke();
        ctx.fillText(Math.round(val)+(m.unit||''),PAD.left-3,y+3);
      });
      // X labels: rotated opp name + date underneath
      const step=Math.max(1,Math.ceil(n/6));
      gameData.forEach(({oppName,dateLbl},i)=>{
        if(i%step!==0&&i!==n-1)return;
        const x=xOf(i);
        const baseY=H-PAD.bottom+4;
        ctx.save();
        ctx.translate(x,baseY);
        ctx.rotate(-Math.PI/4);
        ctx.font=`bold 8px 'Inter',sans-serif`;
        ctx.fillStyle=themeVal('rgba(255,255,255,.7)','rgba(0,0,0,.75)');
        ctx.textAlign='right';
        ctx.fillText(oppName||'?',0,0);
        if(dateLbl){
          ctx.font=`7px 'Inter',sans-serif`;
          ctx.fillStyle=themeVal('rgba(255,255,255,.35)','rgba(0,0,0,.4)');
          ctx.fillText(dateLbl,0,9);
        }
        ctx.restore();
      });
      // Draw series function — avg always white, dots show value label
      function drawSeries(vals,avg,col,showLabels){
        ctx.save();
        // dashed per-game connector
        ctx.strokeStyle=col+'55';ctx.lineWidth=1;ctx.setLineDash([3,3]);
        let s=false;
        vals.forEach((v,i)=>{
          if(v===null)return;
          if(!s){ctx.beginPath();ctx.moveTo(xOf(i),yOf(v));s=true;}
          else ctx.lineTo(xOf(i),yOf(v));
        });
        if(s)ctx.stroke();ctx.setLineDash([]);
        // dots + value labels
        vals.forEach((v,i)=>{
          if(v===null)return;
          const dx=xOf(i),dy=yOf(v);
          ctx.beginPath();ctx.arc(dx,dy,3,0,Math.PI*2);
          ctx.fillStyle=col;ctx.fill();
          ctx.strokeStyle=themeVal('rgba(9,15,34,.9)','rgba(255,255,255,.9)');ctx.lineWidth=1;ctx.stroke();
          if(showLabels){
            ctx.font=`bold 10px 'Inter',sans-serif`;
            ctx.fillStyle=themeVal('rgba(255,255,255,.9)','rgba(0,0,0,.8)');
            ctx.textAlign='center';
            ctx.fillText(Math.round(v)+(m.unit||''),dx,dy-7);
          }
        });
        // rolling avg — white/dark line
        ctx.beginPath();ctx.strokeStyle=themeVal('rgba(255,255,255,0.22)','rgba(0,0,0,0.25)');ctx.lineWidth=2;
        let s2=false;
        avg.forEach((v,i)=>{
          if(v===null)return;
          if(!s2){ctx.moveTo(xOf(i),yOf(v));s2=true;}
          else ctx.lineTo(xOf(i),yOf(v));
        });
        if(s2)ctx.stroke();
        ctx.restore();
      }
      if(homeTeam)drawSeries(vals0,avg0,c0,true);
      if(_trendsShowOpp){
        const oppCol=gameData.find(g=>g.c1opp)?.c1opp||'#FF6644';
        drawSeries(vals1,avg1,oppCol,false);
      }
    });
  });
}

function _analystKey(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();_analystSend();}
}

function _analystSuggest(text){
  const inp=document.getElementById('ai-input');
  if(inp){inp.value=text;inp.focus();}
  _analystSend();
}

async function _analystSend(){
  const inp=document.getElementById('ai-input');
  const btn=document.getElementById('ai-send-btn');
  if(!inp||!btn)return;
  const text=(inp.value||'').trim();
  if(!text||!_aoSample)return;
  inp.value='';
  btn.disabled=true;

  _analystHistory.push({role:'user',content:text});
  renderAnalyst();

  const ctx=_buildMatchContext();
  const turns=[
    {role:'user',content:`${ctx}\n\n---\nUser question: ${text}`}
  ];

  // Add thinking bubble
  const log=document.getElementById('ai-chat-log');
  if(log){
    const thinking=document.createElement('div');
    thinking.className='ai-msg assistant';
    thinking.id='ai-thinking';
    thinking.innerHTML='<div class="ai-bubble thinking">Analysing…</div>';
    log.appendChild(thinking);
    log.scrollTop=log.scrollHeight;
  }

  let fullText='';
  try{
    if(_analystAbort)_analystAbort.abort();
    _analystAbort=new AbortController();
    await _aoSample(turns,{
      modelTier:'default',
      cache:false,
      signal:_analystAbort.signal,
      onText:({text})=>{
        fullText=text;
        const t=document.getElementById('ai-thinking');
        if(t)t.innerHTML='<div class="ai-bubble">'+fullText.replace(/</g,'&lt;').replace(/\n/g,'<br>')+'</div>';
        if(log)log.scrollTop=log.scrollHeight;
      }
    });
    // Commit final
    const t=document.getElementById('ai-thinking');
    if(t)t.id='';
    _analystHistory.push({role:'assistant',content:fullText});
  }catch(err){
    const t=document.getElementById('ai-thinking');
    if(t)t.innerHTML='<div class="ai-bubble thinking">Error: '+(err&&err.message||'Something went wrong')+'</div>';
    setTimeout(()=>{if(t&&t.parentNode)t.parentNode.removeChild(t);},3000);
  }
  btn.disabled=false;
  if(log)log.scrollTop=log.scrollHeight;
  // Hide suggestions after first send
  const sug=document.getElementById('ai-suggestions');
  if(sug)sug.style.display='none';
}

function _analystClear(){
  _analystHistory=[];
  if(_analystAbort){_analystAbort.abort();_analystAbort=null;}
  renderAnalyst();
}

function _safeDocId(name){return name.replace(/[^a-zA-Z0-9\-_.]/g,'_').substring(0,190);}

/* Compress a string using native CompressionStream → base64 */
async function _compress(str){
  try{
    const input=new TextEncoder().encode(str);
    const cs=new CompressionStream('deflate-raw');
    const writer=cs.writable.getWriter();
    writer.write(input);writer.close();
    const chunks=[];const reader=cs.readable.getReader();
    while(true){const{done,value}=await reader.read();if(done)break;chunks.push(value);}
    const total=chunks.reduce((a,b)=>a+b.length,0);
    const out=new Uint8Array(total);let pos=0;
    for(const c of chunks){out.set(c,pos);pos+=c.length;}
    let b='';for(let i=0;i<out.length;i++)b+=String.fromCharCode(out[i]);
    return btoa(b);
  }catch(e){return null;}
}

/* Decompress base64 → string */
async function _decompress(b64){
  try{
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('deflate-raw');
    const writer=ds.writable.getWriter();
    writer.write(bytes);writer.close();
    const chunks=[];const reader=ds.readable.getReader();
    while(true){const{done,value}=await reader.read();if(done)break;chunks.push(value);}
    const total=chunks.reduce((a,b)=>a+b.length,0);
    const out=new Uint8Array(total);let pos=0;
    for(const c of chunks){out.set(c,pos);pos+=c.length;}
    return new TextDecoder().decode(out);
  }catch(e){return null;}
}

async function _saveGameToDB(name,rows,uploadedAt){
  if(!FIRESTORE){
    _showUploadBanner(name,'Not connected to database.','#E07070');
    return false;
  }
  const rawJson=JSON.stringify(rows);
  const rawKb=Math.round(rawJson.length/1024);
  _showUploadBanner(name,'Compressing '+rawKb+'KB…','#D4A820');
  const compressed=await _compress(rawJson);
  if(!compressed){
    _showUploadBanner(name,'Compression failed. File only visible to you this session.','#E07070');
    return {error:'Compression failed'};
  }
  const compKb=Math.round(compressed.length/1024);
  if(compressed.length>900000){
    _showUploadBanner(name,'Still too large after compression ('+compKb+'KB). File only visible to you this session.','#E07070');
    return {error:'File too large even compressed'};
  }
  const data={name,rowsZ:compressed,rowCount:rows.length,uploadedAt:uploadedAt||Date.now()};
  try{
    await FIRESTORE.doc(`${TEAM_CONFIG.configKey}_gamefiles/${_safeDocId(name)}`).set(data);
    const verify=await FIRESTORE.doc(`${TEAM_CONFIG.configKey}_gamefiles/${_safeDocId(name)}`).get();
    if(verify&&verify.exists){
      _showUploadBanner(name,'✓ Saved ('+rawKb+'KB → '+compKb+'KB) — coaches can now see this.','#50D080');
      return {ok:true};
    } else {
      _showUploadBanner(name,'Write appeared to succeed but verify failed.','#D4A820');
      return {error:'Verify failed'};
    }
  }catch(err){
    const code=err&&err.code;
    const msg='DB error: '+(code||err.message||'unknown');
    _showUploadBanner(name,msg+' — file not shared.','#E07070');
    return {error:msg};
  }
}

function _deleteGameFromDB(name){
  if(!FIRESTORE)return;
  FIRESTORE.doc(`${TEAM_CONFIG.configKey}_gamefiles/${_safeDocId(name)}`).delete().catch(()=>{});
}

async function _loadGamesFromDB(){
  if(!FIRESTORE){showEmpty();return;}
  let dbDocs=[];
  try{const snap=await FIRESTORE.collection(`${TEAM_CONFIG.configKey}_gamefiles`).get();dbDocs=snap.docs||[];}catch(e){}
  if(!dbDocs.length){showEmpty();return;}
  try{
    const loaded=[];
    for(const d of dbDocs){
      const g=d.data();
      if(!g||!g.name)continue;
      let rows=null;
      if(g.rowsZ){
        const json=await _decompress(g.rowsZ);
        if(json){try{rows=JSON.parse(json);}catch(e){}}
      } else if(g.rows){
        rows=g.rows;
      }
      if(rows&&rows.length)loaded.push({name:g.name,rows,uploadedAt:g.uploadedAt||0});
    }
    if(loaded.length){
      loaded.forEach(g=>{
        const existing=games.findIndex(x=>x.name===g.name);
        if(existing<0)games.push(g);
        else games[existing]=g;
      });
      for(const g of games){
        const t=detectTeams(g.rows);
        if(t.length>=2){teams=t;teamColors={[teams[0]]:T_COLORS[0],[teams[1]]:T_COLORS[1]};break;}
      }
      updateStoredFilesList(games);
      applySelectionAndRender();
    } else {showEmpty();}
  }catch(e){showEmpty();}
}

/* ── DROPBOX OAUTH + SYNC ─────────────────────────────────────────────────── */
let DBX_TOKEN='',DBX_TOKEN_EXPIRY=0,DBX_REFRESH_TOKEN='',DBX_APP_KEY='',DBX_FOLDER='',DBX_IMPORT_LOG={};
let _dbxFiles=[];

function dbxRedirectUri(){return window.location.origin+window.location.pathname;}

async function loadDropboxConfig(){
  if(!FIRESTORE)return;
  try{
    const cfgSnap=await FIRESTORE.doc(`${TEAM_CONFIG.configKey}/dropbox`).get();
    if(cfgSnap.exists){
      const cfg=cfgSnap.data();
      DBX_REFRESH_TOKEN=cfg.refresh_token||'';
      DBX_APP_KEY=cfg.app_key||'';
      DBX_FOLDER=cfg.folder||'';
      if(!DBX_REFRESH_TOKEN&&cfg.token)DBX_TOKEN=cfg.token;
    }
    const logSnap=await FIRESTORE.doc(`${TEAM_CONFIG.configKey}/dropbox_log`).get();
    if(logSnap.exists){const log=logSnap.data();if(log.entries)DBX_IMPORT_LOG=log.entries;}
  }catch(e){}
}

async function dbxGetValidToken(){
  if(DBX_TOKEN&&Date.now()<DBX_TOKEN_EXPIRY-60000)return DBX_TOKEN;
  if(DBX_REFRESH_TOKEN&&DBX_APP_KEY){
    const r=await fetch('https://api.dropboxapi.com/oauth2/token',{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({grant_type:'refresh_token',refresh_token:DBX_REFRESH_TOKEN,client_id:DBX_APP_KEY})
    });
    if(r.ok){
      const d=await r.json();
      DBX_TOKEN=d.access_token;
      DBX_TOKEN_EXPIRY=Date.now()+(d.expires_in||14400)*1000;
      return DBX_TOKEN;
    }
    throw new Error('Token refresh failed — please reconnect Dropbox');
  }
  if(DBX_TOKEN)return DBX_TOKEN;
  throw new Error('Not connected to Dropbox');
}

function dbxB64Url(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function dbxStartOAuth(){
  const appKey=(document.getElementById('dbx-app-key')||{}).value?.trim();
  const folder=(document.getElementById('dbx-folder-input')||{}).value||'';
  if(!appKey){lxToast('Enter your App Key first','err');return;}
  DBX_APP_KEY=appKey;DBX_FOLDER=folder;
  await FIRESTORE.doc(`${TEAM_CONFIG.configKey}/dropbox`).set({app_key:appKey,folder,refresh_token:DBX_REFRESH_TOKEN||''});
  const verifier=dbxB64Url(crypto.getRandomValues(new Uint8Array(96)));
  const challenge=dbxB64Url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
  sessionStorage.setItem('dbx_pkce_verifier',verifier);
  const params=new URLSearchParams({
    response_type:'code',client_id:appKey,redirect_uri:dbxRedirectUri(),
    code_challenge:challenge,code_challenge_method:'S256',token_access_type:'offline'
  });
  window.location.href='https://www.dropbox.com/oauth2/authorize?'+params;
}

async function dbxHandleOAuthCallback(){
  const params=new URLSearchParams(window.location.search);
  const code=params.get('code');
  if(!code)return;
  history.replaceState({},'',window.location.pathname);
  const verifier=sessionStorage.getItem('dbx_pkce_verifier');
  sessionStorage.removeItem('dbx_pkce_verifier');
  if(!verifier){lxToast('OAuth session expired — please try connecting again','err');return;}
  await loadDropboxConfig();
  if(!DBX_APP_KEY){lxToast('App Key missing — please re-enter it','err');return;}
  try{
    const r=await fetch('https://api.dropboxapi.com/oauth2/token',{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({code,grant_type:'authorization_code',client_id:DBX_APP_KEY,redirect_uri:dbxRedirectUri(),code_verifier:verifier})
    });
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error_description||'Auth failed');}
    const d=await r.json();
    DBX_REFRESH_TOKEN=d.refresh_token||'';
    DBX_TOKEN=d.access_token||'';
    DBX_TOKEN_EXPIRY=Date.now()+(d.expires_in||14400)*1000;
    await FIRESTORE.doc(`${TEAM_CONFIG.configKey}/dropbox`).set({app_key:DBX_APP_KEY,folder:DBX_FOLDER,refresh_token:DBX_REFRESH_TOKEN});
    lxToast("Dropbox connected — you'll never need to do this again!",'ok');
  }catch(e){lxToast('Dropbox auth failed: '+e.message,'err');}
}

async function dbxDisconnect(){
  DBX_TOKEN='';DBX_REFRESH_TOKEN='';DBX_TOKEN_EXPIRY=0;
  await FIRESTORE.doc(`${TEAM_CONFIG.configKey}/dropbox`).set({app_key:DBX_APP_KEY,folder:DBX_FOLDER,refresh_token:''});
  lxToast('Dropbox disconnected','ok');
  renderDataTab();
}

  const res=document.getElementById('dbx-results');

  res.innerHTML='<div style="padding:10px 0;font-size:11px;color:#5a6e60">Scanning folder (recursive)…</div>';

    let allEntries=[],cursor=null,hasMore=true;
    while(hasMore){
      let r;
      if(!cursor){
        r=await fetch('https://api.dropboxapi.com/2/files/list_folder',{
          method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
          body:JSON.stringify({path:DBX_FOLDER||'',recursive:true,limit:2000})
        });
      }else{
        r=await fetch('https://api.dropboxapi.com/2/files/list_folder/continue',{
          method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
          body:JSON.stringify({cursor})
        });
      }
      if(!r.ok){const e=await r.json().catch(()=>({}));res.innerHTML=`<div style="color:#c0392b;font-size:11px;padding:8px 0">Error: ${e.error_summary||('HTTP '+r.status)}</div>`;return;}
      const data=await r.json();
      allEntries=allEntries.concat(data.entries||[]);
      hasMore=data.has_more;cursor=data.cursor;
    }
    const rootLower=(DBX_FOLDER||'').toLowerCase();
    const xmlFiles=allEntries.filter(e=>e['.tag']==='file'&&(e.name.toLowerCase().endsWith('.xml')||e.name.toLowerCase().endsWith('.csv')));
    xmlFiles.sort((a,b)=>b.server_modified.localeCompare(a.server_modified));
    _dbxFiles=xmlFiles;
    if(!xmlFiles.length){res.innerHTML='<div style="padding:10px 0;font-size:11px;color:#5a6e60">No XML/CSV files found in this folder.</div>';return;}
    const newCount=xmlFiles.filter(f=>!DBX_IMPORT_LOG[f.path_lower]||DBX_IMPORT_LOG[f.path_lower].modified!==f.server_modified).length;
    const rows=xmlFiles.map(f=>{
      const log=DBX_IMPORT_LOG[f.path_lower];
      const isNew=!log,isUpdated=log&&log.modified!==f.server_modified,isDone=log&&log.modified===f.server_modified;
      const status=isNew?'<span style="color:#1a6b3e;font-weight:700;font-size:10px">New</span>':isUpdated?'<span style="color:#d4860e;font-weight:700;font-size:10px">Updated</span>':'<span style="color:#9aad9f;font-size:10px">✓ Done</span>';
      const sz=f.size>1048576?(f.size/1048576).toFixed(1)+'MB':(f.size/1024).toFixed(0)+'KB';
      return`<tr><td style="width:28px"><input type="checkbox" class="dbx-cb" data-path="${f.path_lower}" ${!isDone?'checked':''}></td>
        <td style="font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</td>
        <td style="font-size:10px;color:#5a6e60;white-space:nowrap">${sz}</td>
        <td style="font-size:10px;color:#5a6e60;white-space:nowrap">${f.server_modified.slice(0,10)}</td>
        <td>${status}</td></tr>`;
    }).join('');
    res.innerHTML=`
      <div style="display:flex;align-items:center;justify-content:space-between;margin:10px 0 8px">
        <div style="font-size:11px;color:#5a6e60">${xmlFiles.length} files · <strong style="color:#1a6b3e">${newCount} new/updated</strong></div>
        <div style="display:flex;gap:6px">
          <button class="dbx-btn" onclick="dropboxImportSelected()">Import Selected</button>
          <button class="dbx-btn primary" onclick="dropboxImportAll()">↓ Import All New</button>
        </div>
      </div>
      <div style="overflow-x:auto;max-height:200px;border:1px solid #e2e8e2;border-radius:8px;margin-bottom:10px">
        <table style="width:100%;border-collapse:collapse;font-size:11px">
          <thead><tr style="background:#fafbfa"><th style="padding:6px 8px;text-align:left;border-bottom:1px solid #e2e8e2;width:28px"><input type="checkbox" title="Select all" onchange="document.querySelectorAll('.dbx-cb').forEach(c=>c.checked=this.checked)"></th><th style="padding:6px 8px;text-align:left;border-bottom:1px solid #e2e8e2">File</th><th style="padding:6px 8px;border-bottom:1px solid #e2e8e2">Size</th><th style="padding:6px 8px;border-bottom:1px solid #e2e8e2">Modified</th><th style="padding:6px 8px;border-bottom:1px solid #e2e8e2">Status</th></tr></thead>
          <tbody>${rows}</tbody></table></div>
      <div id="dbx-progress" style="display:none">
        <div class="progress-bar"><div class="progress-fill" id="dbx-prog-fill" style="width:0%"></div></div>
        <div class="progress-lbl" id="dbx-prog-lbl">Importing…</div>
      </div>
      <div id="dbx-report"></div>`;
  }catch(e){res.innerHTML=`<div style="color:#c0392b;font-size:11px;padding:8px 0">Network error: ${e.message}</div>`;}
}

function dropboxImportAll(){
  const paths=_dbxFiles.filter(f=>!DBX_IMPORT_LOG[f.path_lower]||DBX_IMPORT_LOG[f.path_lower].modified!==f.server_modified).map(f=>f.path_lower);
  if(!paths.length){lxToast('All files already imported','ok');return;}
  dropboxImportPaths(paths);
}
function dropboxImportSelected(){
  const paths=Array.from(document.querySelectorAll('.dbx-cb:checked')).map(c=>c.dataset.path);
  if(!paths.length){lxToast('Select at least one file','err');return;}

async function dropboxImportPaths(paths){
  const pd=document.getElementById('dbx-progress'),pf=document.getElementById('dbx-prog-fill'),pl=document.getElementById('dbx-prog-lbl'),rpt=document.getElementById('dbx-report');
  if(pd)pd.style.display='block';
  let token;
  try{token=await dbxGetValidToken();}catch(e){lxToast(e.message,'err');if(pd)pd.style.display='none';return;}
  const results=[];
  for(let i=0;i<paths.length;i++){
    const path=paths[i];
    const fname=path.split('/').pop();
    if(pl)pl.textContent=`Downloading ${fname} (${i+1}/${paths.length})…`;
    if(pf)pf.style.width=Math.round((i/paths.length)*100)+'%';
    try{
      const r=await fetch('https://content.dropboxapi.com/2/files/download',{
        method:'POST',headers:{'Authorization':'Bearer '+token,'Dropbox-API-Arg':JSON.stringify({path})}
      });
      if(!r.ok){results.push({fname,status:'err',msg:'Download failed (HTTP '+r.status+')'});continue;}
      // Read as buffer to handle UTF-16 encoded files (Sportscode XMLs may be UTF-16)
      const buf=await r.arrayBuffer();
      const bytes=new Uint8Array(buf);
      // Detect encoding from BOM
      let enc='utf-8';
      if(bytes[0]===0xFF&&bytes[1]===0xFE)enc='utf-16le';
      else if(bytes[0]===0xFE&&bytes[1]===0xFF)enc='utf-16be';
      const text=new TextDecoder(enc).decode(buf);
      const trimmed=text.trimStart();
      // Detect JSON error response (scope issue)
      if(trimmed.startsWith('{')||trimmed.startsWith('[')){
        let errMsg='Dropbox error (scope issue)';
        try{const j=JSON.parse(trimmed);if(j.error_summary)errMsg='Dropbox error: '+j.error_summary;}catch(e){}
        results.push({fname,status:'err',msg:errMsg});continue;
      }
      const rows=parseFile(text,fname);
      if(!rows.length){results.push({fname,status:'warn',msg:'No data found in file'});continue;}
      const now=Date.now();
      const existing=games.findIndex(g=>g.name===fname);
      if(existing>=0)games[existing]={name:fname,rows,uploadedAt:games[existing].uploadedAt||now};
      else games.push({name:fname,rows,uploadedAt:now});
      const saveResult=await _saveGameToDB(fname,rows,now);
      const fEntry=_dbxFiles.find(f=>f.path_lower===path);
      if(fEntry){
        DBX_IMPORT_LOG[path]={modified:fEntry.server_modified,added:existing<0?1:0,updated:existing>=0?1:0};
        await FIRESTORE.doc(`${TEAM_CONFIG.configKey}/dropbox_log`).set({entries:DBX_IMPORT_LOG});
      }
      results.push({fname,status:saveResult&&saveResult.ok?'ok':'warn',msg:rows.length+' rows imported'});
    }catch(e2){results.push({fname,status:'err',msg:e2.message});}
  }
  if(pf)pf.style.width='100%';if(pl)pl.textContent='Done!';
  setTimeout(()=>{if(pd)pd.style.display='none';if(pf)pf.style.width='0%';},1200);
  if(rpt)rpt.innerHTML=results.map(r=>{
    const ic=r.status==='ok'?'✓':r.status==='warn'?'⚠':'✗';
    return`<div class="val-row val-${r.status}"><div class="val-ic">${ic}</div><div><strong>${r.fname}</strong> <span style="color:#5a6e60;font-weight:400">${r.msg}</span></div></div>`;
  }).join('');
  const ok=results.filter(r=>r.status!=='err').length;
  lxToast(`Imported ${ok}/${results.length} files`,'ok');
  updateStoredFilesList(games);
  applySelectionAndRender();
}

/* ── USERS TAB (admin only) ──────────────────────────────────────────────── */
let LX_ALL_USERS=[];
async function renderUsersTab(){
  if(!FIRESTORE)return;
  try{
    const snap=await FIRESTORE.collection('users').get();
    const docs=snap&&snap.docs?snap.docs:[];
    LX_ALL_USERS=docs.map(d=>{const data=typeof d.data==='function'?d.data():d;return{...data,_uid:d.id};});
  }catch(e){LX_ALL_USERS=[];}

  const el=document.getElementById('us');
  if(!el)return;
  const rows=LX_ALL_USERS.sort((a,b)=>(a.email||'').localeCompare(b.email||'')).map(u=>{
    const isMe=LX_SESSION&&u._uid===LX_SESSION.uid;
    const role=u.role||'viewer';
    const roleBadge=role==='admin'?'<span style="color:#1a6b3e;font-weight:700;font-size:11px">Admin</span>':role==='blocked'?'<span style="color:#c0392b;font-weight:700;font-size:11px">Blocked</span>':'<span style="color:#5a6e60;font-size:11px">Viewer</span>';
    const roleButtons=isMe?'<span style="color:#9aad9f;font-size:10px">You</span>'
      :`<div style="display:flex;gap:4px">
          <button class="del-btn" onclick="lxSetRole('${u._uid}','viewer')" ${role==='viewer'?'disabled style="opacity:.4"':''}>Viewer</button>
          <button class="del-btn" onclick="lxSetRole('${u._uid}','admin')" style="${role==='admin'?'background:#1a6b3e;color:#fff':''}">Admin</button>
          <button class="del-btn" onclick="lxSetRole('${u._uid}','blocked')" style="${role==='blocked'?'background:#c0392b;color:#fff':''}">Block</button>
        </div>`;
    return`<tr>
      <td style="font-size:12px">${u.email||u._uid}</td>
      <td>${u.name||'—'}</td>
      <td>${roleBadge}</td>
      <td style="color:#9aad9f;font-size:11px">${u.lastLogin?u.lastLogin.slice(0,10):'Never'}</td>
      <td>${roleButtons}</td></tr>`;
  }).join('');

  el.innerHTML=`
    <div style="max-width:800px">
      <div style="margin-bottom:18px"><h2 style="font-size:20px;font-weight:700;color:#111">Users</h2>
        <p style="font-size:12px;color:#5a6e60;margin-top:4px">${LX_ALL_USERS.length} accounts · users log in with their email at this app's URL</p></div>
      <div class="add-user-card">
        <h3>Adding Users</h3>
        <p style="font-size:12px;color:#5a6e60;line-height:1.6;margin-top:6px">Create accounts in <a href="https://console.firebase.google.com/project/irfu-referee-analysis/authentication/users" target="_blank" style="color:#1a6b3e">Firebase Console → Authentication → Add user</a>. They'll appear here after their first login. Then set their role.</p>
      </div>
      ${LX_ALL_USERS.length?`<div style="overflow-x:auto;background:#fff;border:1px solid #e2e8e2;border-radius:10px">
        <table style="width:100%;border-collapse:collapse">
          <thead><tr style="background:#fafbfa"><th style="padding:10px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#9aad9f;border-bottom:1px solid #e2e8e2">Email</th><th style="padding:10px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#9aad9f;border-bottom:1px solid #e2e8e2">Name</th><th style="padding:10px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#9aad9f;border-bottom:1px solid #e2e8e2">Role</th><th style="padding:10px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#9aad9f;border-bottom:1px solid #e2e8e2">Last Login</th><th style="padding:10px 14px;border-bottom:1px solid #e2e8e2"></th></tr></thead>
          <tbody>${rows}</tbody></table></div>`:'<div style="font-size:12px;color:#9aad9f;padding:20px 0;text-align:center">No users have logged in yet.</div>'}
    </div>`;
}

async function lxSetRole(uid,newRole){
  try{
    await FIRESTORE.doc(`users/${uid}`).update({role:newRole});
    lxToast('Role updated to '+newRole,'ok');
    renderUsersTab();
  }catch(e){lxToast('Failed to update role','err');}
}

/* ── INIT ────────────────────────────────────────────────────────────────── */
window._aoIsAdmin=false;

async function lxInit(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    FIRESTORE=firebase.firestore();
    AUTH=firebase.auth();
  }catch(e){
    const loading=document.getElementById('ao-loading');
    if(loading)loading.innerHTML='<div style="color:#E07070;font-size:13px;font-family:Barlow,sans-serif;text-align:center;padding:20px">Unable to connect.<br>Please refresh.</div>';
    return;
  }

  // Apply team config to page title and sidebar
  document.title=TEAM_CONFIG.name;
  const sbClub=document.getElementById('sb-club-name');
  if(sbClub)sbClub.textContent=TEAM_CONFIG.name.toUpperCase();

  // No redirect result needed — using GIS credential flow instead

  AUTH.onAuthStateChanged(async(user)=>{
    if(user){
      try{
        const userSnap=await FIRESTORE.doc(`users/${user.uid}`).get();
        let role='viewer';
        let name=user.displayName||user.email.split('@')[0];
        if(userSnap.exists){
          const data=userSnap.data();
          role=data.role||'viewer';
          name=data.name||name;
          await FIRESTORE.doc(`users/${user.uid}`).update({lastLogin:new Date().toISOString()});
        }else{
          // First user to log in becomes admin automatically
          role='admin';
          await FIRESTORE.doc(`users/${user.uid}`).set({
            email:user.email,name,role,
            createdAt:new Date().toISOString(),
            lastLogin:new Date().toISOString()
          });
        }
        if(role==='blocked'){
          AUTH.signOut();
          const loading=document.getElementById('ao-loading');if(loading)loading.style.display='none';
          _lxShowLogin();
          const err=document.getElementById('lx-err');if(err)err.textContent='Your account has been suspended.';
          return;
        }
        LX_SESSION={uid:user.uid,email:user.email,name,type:role};
        const isAdmin=role==='admin';
        _lxSetAdminUI(isAdmin);
        // Show user email in sidebar
        const emailEl=document.getElementById('sb-user-email');
        if(emailEl)emailEl.textContent=user.email;
        // Unlock app
        const ov=document.getElementById('auth-overlay');
        if(ov){ov.classList.add('ao-fade');setTimeout(()=>{ov.style.display='none';},400);}
        // Handle Dropbox OAuth callback
        if(window.location.search.includes('code='))await dbxHandleOAuthCallback();
        // Load games
        await _loadGamesFromDB();
        renderHome();
      }catch(e){
        const loading=document.getElementById('ao-loading');if(loading)loading.style.display='none';
        _lxShowLogin();
        const errMsg=(e&&e.code)?e.code+': '+e.message:(e&&e.message?e.message:'Unknown error');
        const err=document.getElementById('lx-err');if(err)err.textContent='Login error: '+errMsg;
        AUTH.signOut();
      }
    }else{
      LX_SESSION=null;
      const loading=document.getElementById('ao-loading');if(loading)loading.style.display='none';
      _lxShowLogin();
    }
  });
}

window.addEventListener('load',()=>{lxInit();_applyThemeBtn();});

function toggleTheme(){
  const html=document.documentElement;
  const isLight=html.getAttribute('data-theme')==='light';
  const next=isLight?'dark':'light';
  if(next==='light'){html.setAttribute('data-theme','light');}
  else{html.removeAttribute('data-theme');}
  try{localStorage.setItem('lx_theme',next);}catch(e){}
  _applyThemeBtn();
}
function _applyThemeBtn(){
  const btn=document.getElementById('theme-toggle-btn');
  if(!btn)return;
  const isLight=document.documentElement.getAttribute('data-theme')==='light';
  btn.textContent=isLight?'🌙 DARK MODE':'☀ LIGHT MODE';
  btn.style.background=isLight?'rgba(0,0,0,.07)':'rgba(0,0,0,.05)';
}


/* ── ABSOLUTE LAYOUT FIX: measure real heights and set three-col top ── */
function fixLayout(){
  if(window.innerWidth<=768) return;
  /* Adjust .content top when match-banner is visible */
  var banner=document.getElementById('match-banner');
  var bannerH=(banner&&getComputedStyle(banner).display!=='none')?banner.offsetHeight:0;
  var content=document.querySelector('.content');
  if(content) content.style.top=bannerH+'px';
  /* Set .three-col top to actual team-switcher height in each panel */
  document.querySelectorAll('.panel').forEach(function(panel){
    var ts=panel.querySelector('.team-switcher');
    var tsH=ts?ts.offsetHeight:0;
    var tc=panel.querySelector('.three-col');
    if(tc) tc.style.top=tsH+'px';
  });
}
fixLayout();
window.addEventListener('resize',fixLayout);
window.addEventListener('load',fixLayout);
setTimeout(fixLayout,100);
setTimeout(fixLayout,500);
/* Re-run after each tab switch */
(function(){
  var _st=window.setTab;
  if(_st) window.setTab=function(t){_st(t);setTimeout(fixLayout,20);};
  var _stt=window.setTabAndTeam;
  if(_stt) window.setTabAndTeam=function(t,i){_stt(t,i);setTimeout(fixLayout,20);};
})();
