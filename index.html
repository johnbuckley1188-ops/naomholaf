<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Leixlip Hurling</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Barlow+Condensed:wght@400;700;800;900&family=Barlow:wght@400;500;600&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ── THEME VARIABLES (overridden per variant) ──────────────────────────── */
:root{
  --accent:#D4A820;
  --accent-rgb:212,168,32;
  --sb-bg:#FFFFFF;
  --sb-accent-dim:rgba(0,0,0,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;padding:0;overflow:hidden;background:#070C1A;color:#E2E8F5;font-family:'Barlow',sans-serif;font-size:14px}
/* Decorative dot-grid background */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(91,141,239,.13) 1px,transparent 1px);
  background-size:26px 26px}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 55% at 15% 80%,rgba(91,141,239,.06) 0%,transparent 70%),
    radial-gradient(ellipse 50% 45% at 85% 20%,rgba(201,160,40,.05) 0%,transparent 70%)}
/* APP SHELL — fixed to viewport; children use absolute positioning so heights are always definite */
.app-shell{position:fixed;inset:0;z-index:1;overflow:hidden}
/* SIDEBAR — absolute, left column */
.sidebar{position:absolute;left:0;top:0;bottom:0;width:210px;background:var(--sb-bg);border-right:1px solid rgba(0,0,0,.1);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
/* MAIN AREA — absolute, fills right of sidebar; definite height guaranteed */
.main-area{position:absolute;left:210px;right:0;top:0;bottom:0;display:flex;flex-direction:column;overflow:hidden}
/* SIDEBAR HEADER */
.sb-header{padding:20px 16px 16px;border-bottom:1px solid rgba(0,0,0,.08);flex-shrink:0}
.sb-brand{font-family:'Inter',sans-serif;font-weight:600;font-size:15px;letter-spacing:2px;color:#111111;line-height:1;text-transform:uppercase}
.sb-club{font-family:'Inter',sans-serif;font-weight:400;font-size:10px;letter-spacing:1px;color:rgba(0,0,0,.4);margin-top:5px}
/* SIDEBAR CLOSE BUTTON (mobile) */
.sb-close-wrap{position:absolute;top:14px;right:12px}
/* SIDEBAR NAV */
.sb-nav{display:flex;flex-direction:column;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.08);flex-shrink:0}
.nav-item{display:flex;align-items:center;padding:10px 18px;color:rgba(0,0,0,.5);font-family:'Inter',sans-serif;font-weight:400;font-size:13px;letter-spacing:.1px;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{color:rgba(0,0,0,.85);background:rgba(0,0,0,.04);border-left-color:rgba(0,0,0,.12)}
.nav-item.active{color:#111111;border-left-color:var(--accent);background:rgba(0,0,0,.05);font-weight:600}
/* DATA SECTIONS */
.sb-logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;letter-spacing:3px;color:var(--accent);padding:10px 12px 9px;border-bottom:1px solid rgba(100,130,200,.12);white-space:nowrap;flex-shrink:0}
.sb-logo em{font-style:normal;color:#5B8DEF}
.sb-section{padding:8px 10px 7px;border-bottom:1px solid rgba(0,0,0,.07)}
.sb-lbl{font-family:'Inter',sans-serif;font-size:9px;font-weight:500;letter-spacing:1.5px;color:rgba(0,0,0,.3);text-transform:uppercase;margin-bottom:5px}
/* SPORT TOGGLE */
.sport-toggle{display:flex;background:#0D1428;border:1px solid rgba(100,130,200,.2);border-radius:4px;overflow:hidden;width:100%}
.sport-btn{flex:1;background:none;border:none;color:#6A7FA8;padding:5px 4px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:.5px;cursor:pointer;transition:all .15s}
.sport-btn.active{background:var(--accent);color:#070C1A}
/* TEAM ROWS IN SIDEBAR */
.sb-team-row{display:flex;align-items:center;gap:7px;padding:5px 10px}
.sb-team-logo{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:12px;color:#fff;cursor:pointer;overflow:hidden;position:relative;border:2px solid rgba(255,255,255,.18);transition:border-color .2s}
.sb-team-logo:hover{border-color:rgba(255,255,255,.5)}
.sb-team-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:50%}
.sb-team-logo .upload-hint{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;opacity:0;transition:opacity .2s;border-radius:50%;gap:1px}
.sb-team-logo:hover .upload-hint{opacity:1}
.sb-team-info{flex:1;min-width:0}
.sb-team-name{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#111}
.sb-team-score{font-family:'Roboto Mono',monospace;font-weight:600;font-size:11px;color:rgba(0,0,0,.45);margin-top:1px;display:none}
/* COLOUR PICKER SWATCH */
.sb-color-swatch{width:22px;height:22px;border-radius:4px;flex-shrink:0;cursor:pointer;border:2px solid rgba(0,0,0,.2);padding:0;position:relative;overflow:hidden;transition:border-color .2s}
.sb-color-swatch:hover{border-color:rgba(0,0,0,.5)}
.sb-color-swatch input[type=color]{position:absolute;inset:-4px;width:calc(100%+8px);height:calc(100%+8px);opacity:0;cursor:pointer;border:none;padding:0}
.sb-swap-btn{display:block;width:calc(100% - 20px);margin:2px 10px 4px;background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.12);color:#555;padding:4px 8px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;cursor:pointer;text-align:center;transition:all .15s}
.sb-swap-btn:hover{background:rgba(0,0,0,.08);color:var(--accent);border-color:var(--accent)}
/* SIDEBAR FILTER PILLS */
.sb-filter-pills{display:flex;flex-direction:column;gap:3px}
.filter-pill{background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.1);color:#555;padding:5px 10px;border-radius:4px;font-family:'Inter',sans-serif;font-weight:400;font-size:12px;letter-spacing:.1px;cursor:pointer;transition:all .15s;text-align:left;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filter-pill.active{background:var(--sb-accent-dim);border-color:var(--accent);color:var(--accent)}
/* GAME FILTER */
.gf-quick{display:flex;gap:3px;margin-bottom:5px}
.gf-btn{flex:1;background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.12);color:#666;padding:3px 4px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:.5px;cursor:pointer;text-align:center;transition:all .15s}
.gf-btn.active{background:var(--sb-accent-dim);border-color:var(--accent);color:var(--accent)}
.gf-dates{display:flex;flex-direction:column;gap:3px}
.gf-date-row{display:flex;align-items:center;gap:4px}
.gf-date-lbl{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1px;color:#888;width:22px;flex-shrink:0}
.gf-date-input{flex:1;background:#F5F5F5;border:1px solid rgba(0,0,0,.15);color:#333;padding:3px 5px;border-radius:3px;font-family:'Barlow Condensed',sans-serif;font-size:10px;outline:none;min-width:0}
.gf-date-input:focus{border-color:var(--accent)}
.gf-date-input::-webkit-calendar-picker-indicator{filter:none;cursor:pointer;width:10px;height:10px;opacity:.5}
/* STORED FILES */
.stored-file-row{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid rgba(0,0,0,.04)}
.stored-file-row:last-child{border-bottom:none}
.stored-file-name{flex:1;font-family:'Inter',sans-serif;font-size:11px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stored-file-del{background:none;border:none;color:#999;cursor:pointer;font-size:11px;padding:0 2px;flex-shrink:0;line-height:1}
.stored-file-del:hover{color:#E74C3C}
/* STORED FILES DROPDOWN TOGGLE */
.sf-toggle-btn{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;padding:0;cursor:pointer;text-align:left}
.sf-caret{font-size:8px;color:rgba(0,0,0,.3);transition:transform .15s;display:inline-block;margin-left:4px}
.sf-body{display:none;margin-top:5px}
.sf-open .sf-body{display:block}
/* GAME FILTER CHECKBOXES */
.gf-game-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid rgba(0,0,0,.04)}
.gf-game-row:last-child{border-bottom:none}
.gf-game-chk{width:14px;height:14px;flex-shrink:0;accent-color:var(--accent);cursor:pointer}
.gf-game-lbl{flex:1;font-family:'Inter',sans-serif;font-weight:400;font-size:11px;color:rgba(0,0,0,.65);min-width:0}
.gf-game-lbl.active{color:rgba(0,0,0,.75);font-weight:500}
.gf-game-date{font-family:'Inter',sans-serif;font-size:9px;color:#aaa;flex-shrink:0}
/* SIDEBAR BOTTOM BUTTONS */
.sb-bottom{padding:8px;margin-top:auto;border-top:1px solid rgba(0,0,0,.08);display:flex;flex-direction:column;gap:5px}
.sb-btn{display:block;width:100%;background:#F0F0F0;border:1px solid rgba(0,0,0,.12);color:#444;padding:7px 10px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;cursor:pointer;text-align:center;transition:all .15s}
.sb-btn:hover{background:rgba(0,0,0,.1)}
.sb-btn.upload{background:var(--accent);color:#070C1A;border-color:var(--accent)}
.sb-btn.upload:hover{filter:brightness(1.1)}
.sb-btn.pdf{background:rgba(91,141,239,.12);border-color:rgba(91,141,239,.35);color:#7BA8EF}
.sb-btn.pdf:hover{background:rgba(91,141,239,.22)}
/* TABS (top bar hidden — tabs moved to sidebar) */
.tab-nav{display:none}
.tab-btn{background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 14px;color:#6A7FA8;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:1.5px;cursor:pointer;white-space:nowrap;transition:color .15s}
.tab-btn.active,.tab-btn:hover{color:#D4A820;border-bottom-color:#D4A820}
/* CONTENT — absolute, fills main-area (top adjusted by JS if banner is visible) */
.content{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden}
/* PANELS — absolute stack; only .active is shown */
.panel{display:none;position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden}
.panel.active{display:block}
/* TEAM SWITCHER — pinned to top of panel */
.team-switcher{position:absolute;top:0;left:0;right:0;display:flex;padding:0 14px;background:#090F22;border-bottom:1px solid rgba(100,130,200,.12)}
.tsw-btn{background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-1px;padding:7px 13px;color:#6A7FA8;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:1.5px;cursor:pointer;transition:color .15s}
.tsw-btn.active{color:#E2E8F5;border-bottom-color:#E2E8F5}
/* THREE-COLUMN GRID — absolute, top set by JS to team-switcher height (0 if none), fills rest */
.three-col{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;gap:10px;overflow:hidden;background:rgba(80,110,180,.2);border-top:2px solid rgba(80,110,180,.25)}
.col-block{flex:1;background:#070C1A;overflow-y:auto;min-width:0;border:none}
/* Always-visible scrollbars so macOS users can see content is scrollable */
.col-block::-webkit-scrollbar{width:5px}
.col-block::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}
.col-block::-webkit-scrollbar-thumb{background:rgba(100,140,220,.4);border-radius:3px}
.col-block::-webkit-scrollbar-thumb:hover{background:rgba(100,140,220,.7)}
.col-hd{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;letter-spacing:2.5px;color:#FFFFFF;text-transform:uppercase;text-align:center;padding:10px 8px 9px;background:#080E20;border-bottom:1px solid rgba(100,130,200,.1);position:sticky;top:0;z-index:2}
/* COMPARE ROWS */
.cmp-section-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:17px;letter-spacing:2px;color:#FFFFFF;text-transform:uppercase;text-align:center;padding:4px 4px 3px;background:rgba(80,110,180,.1);border-top:2px solid rgba(80,110,180,.22);border-bottom:1px solid rgba(80,110,180,.12);margin-top:2px}
.cmp-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:2px 8px;gap:2px;border-bottom:1px solid rgba(100,130,200,.05)}
.cmp-l{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-align:right;min-width:50px;color:#B0C4DC}
.cmp-m{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:1px;color:#8CA4C4;text-align:center;white-space:nowrap;padding:0 6px;text-transform:uppercase;min-width:100px}
.cmp-r{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-align:left;min-width:50px;color:#B0C4DC}
.cmp-poss-wrap{padding:2px 20px 4px;border-bottom:1px solid rgba(100,130,200,.05)}
.cmp-poss-bar{height:14px;display:flex;border-radius:2px;overflow:hidden;margin:4px 0 3px}
.cmp-poss-vals{display:flex;justify-content:space-between}
.cmp-poss-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px}
/* DONUT */
.donut-pair{display:flex;justify-content:space-around;padding:6px 4px 3px;gap:4px}
.d-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.d-wrap canvas{display:block}
.d-lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;color:#8CA4C4;text-transform:uppercase;text-align:center;line-height:1.4}
/* PO HEADER STATS */
.po-hdr{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;text-align:center;padding:4px 4px 3px;background:rgba(0,0,0,.15)}
.po-hdr-lbl{font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:1px;color:#8CA4C4;text-transform:uppercase}
.po-hdr-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:30px;line-height:1.2;color:#E8EDF5}
/* PITCH */
.pitch-container{position:relative;overflow:hidden}
.pitch-single{width:62%;margin:0 auto}
.pitch-bg{width:100%;display:block}
.pitch-overlay{position:absolute;top:0;left:0;width:100%;height:100%}
.pitch-wrap{padding:4px 6px 2px}
.pitch-lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:1.5px;color:#8BA0C0;text-transform:uppercase;margin-bottom:3px}
/* ZONE TABLE */
.zone-tbl{width:100%;border-collapse:collapse;font-family:'Barlow Condensed',sans-serif;font-size:15px}
.zone-tbl th{font-size:13px;letter-spacing:1px;color:#7A90B0;text-transform:uppercase;padding:4px 4px;border-bottom:1px solid rgba(100,130,200,.12);text-align:center}
.zone-tbl td{padding:4px 4px;text-align:center;font-weight:700;color:#B0C4DC;border-bottom:1px solid rgba(100,130,200,.05)}
.zone-tbl td:first-child{text-align:center;color:#A0B8D0;font-weight:600;font-size:15px}
/* MATCH BANNER — absolute, pinned to top of main-area when visible; z-index:20 ensures it always sits above col-hd (z-index:2) */
.match-banner{display:none;position:absolute;top:0;left:0;right:0;z-index:20;align-items:center;background:#0D1A3A;border-bottom:3px solid var(--accent);min-height:88px}
.mb-team{display:flex;align-items:center;gap:12px;flex:1;padding:7px 14px;min-width:0;justify-content:flex-end}
.mb-team.right{flex-direction:row-reverse;justify-content:flex-end}
.mb-logo{width:50px;height:50px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;color:#fff;overflow:hidden;position:relative;box-shadow:0 2px 12px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.25)}
.mb-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:50%}
.mb-info{min-width:0;text-align:center}
.mb-name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:30px;letter-spacing:1px;white-space:nowrap;font-style:italic;line-height:1}
.mb-gp{display:flex;gap:14px;margin-top:4px;justify-content:center}
.mb-gp-item{display:flex;flex-direction:column}
.mb-gp-lbl{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1.5px;color:#6A80A8;text-transform:uppercase;font-weight:700}
.mb-gp-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;color:#E8EDF5;line-height:1.1}
.mb-center{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px;flex-shrink:0}
.mb-totals{display:flex;align-items:center;gap:12px}
.mb-total{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:42px;line-height:1}
.mb-vsep{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;color:#3A5070;letter-spacing:1px}
.mb-title-block{display:flex;align-items:center;justify-content:center;padding:0 18px;flex-shrink:0;border-left:1px solid rgba(201,160,40,.3)}
.mb-page-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:24px;letter-spacing:3px;color:#FFFFFF;text-transform:uppercase;font-style:italic;white-space:nowrap}
/* SHOT TABLE */
.shot-tbl{width:100%;border-collapse:collapse;font-family:'Barlow Condensed',sans-serif;font-size:14px}
.shot-tbl th{font-size:12px;letter-spacing:1px;color:#7A90B0;text-transform:uppercase;padding:5px 5px;border-bottom:1px solid rgba(100,130,200,.14);text-align:center}
.shot-tbl td{padding:5px 5px;text-align:center;font-weight:700;color:#B0C4DC;border-bottom:1px solid rgba(100,130,200,.05);font-family:'Roboto Mono',monospace;font-size:14px}
.shot-tbl td.row-lbl{text-align:left;color:#A0B8D0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px}
.shot-tbl tr.score-row td{color:#2ECC71}
.shot-tbl tr.score-row td.row-lbl{color:#2ECC71}
/* FUNNEL */
.funnel{display:flex;align-items:center;justify-content:center;padding:8px 4px;background:rgba(0,0,0,.12);border-top:1px solid rgba(100,130,200,.1)}
.f-step{text-align:center;flex:1}
.f-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;line-height:1;color:#B0C4DC}
.f-lbl{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;color:#8CA4C4;text-transform:uppercase;margin-top:2px}
.f-pct{font-family:'Roboto Mono',monospace;font-size:11px;color:#D4A820;margin-top:1px}
.f-arr{color:#3A5070;font-size:14px;padding:0 2px;flex-shrink:0}
.f-arr-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;padding:0 2px}
/* TURNOVER TYPE */
.to-types{display:flex;justify-content:space-around;padding:5px 4px 7px;flex-wrap:wrap;gap:3px}
.to-type{text-align:center;min-width:28px}
.to-type-v{font-family:'Roboto Mono',monospace;font-weight:600;font-size:15px;color:#B0C4DC}
.to-type-l{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.5px;color:#7A90B0;text-transform:uppercase;margin-top:1px;line-height:1.3}
/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:14px;text-align:center;padding:40px 20px}
.empty-icon{font-size:36px;opacity:.3}
.empty h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;letter-spacing:2px;color:#8BA0C0}
.upload-zone{border:2px dashed rgba(100,130,200,.25);border-radius:10px;padding:24px 40px;text-align:center;cursor:pointer;transition:border-color .2s;display:block}
.upload-zone:hover{border-color:#D4A820}
.upload-zone input{display:none}
.upload-zone-lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;color:#8BA0C0}
/* 2-PITCH ROW */
.two-pitch{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px 4px 2px}

.sb-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:699}

/* HOME PANEL */
#panel-home{flex-direction:column;align-items:center;justify-content:center}

.home-splash{display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;padding:40px 30px;max-width:380px}
.home-shield{width:80px;height:96px;margin-bottom:28px;opacity:.95}
.home-brand{font-family:'Inter',sans-serif;font-weight:600;font-size:38px;letter-spacing:6px;color:#FFFFFF;line-height:1;text-transform:uppercase}
.home-sub{font-family:'Inter',sans-serif;font-weight:300;font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.4);text-transform:uppercase;margin-top:10px}
.home-divider{width:40px;height:1px;background:rgba(255,255,255,.25);margin:22px auto}
.home-club{font-family:'Inter',sans-serif;font-weight:400;font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.4);text-transform:uppercase}
.home-cta{margin-top:40px;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:1.5px;color:rgba(255,255,255,.2);text-transform:uppercase}
/* TRENDS PANEL */
#panel-trends{flex-direction:column;overflow:hidden}

.trends-opp-toggle input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
.trends-opp-toggle span{font-family:'Inter',sans-serif;font-size:11px;color:rgba(255,255,255,.6);white-space:nowrap}
.trends-body{flex:1;overflow-y:auto;padding:10px 10px 16px;display:flex;flex-direction:column;gap:14px}
.trends-section{}
.trends-section-lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:1.8px;color:rgba(255,255,255,.3);text-transform:uppercase;margin-bottom:6px;padding-left:2px}
.trends-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}

.trends-card-title{font-family:'Inter',sans-serif;font-weight:600;font-size:10px;color:#fff;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trends-canvas{width:100%;height:130px;display:block}
.trends-empty{text-align:center;padding:40px 20px;color:rgba(255,255,255,.3);font-family:'Inter',sans-serif;font-size:12px}
/* AI ANALYST — hidden by .panel{display:none} when inactive; flex only when active */
#panel-analyst{flex-direction:column;height:100%;overflow:hidden;padding:0}
#panel-analyst.active{display:flex}
/* MOMENTUM + TIME STATS — inner layout uses flex column; panel must be flex container for it to work */

#panel-momentum.active{display:flex}
#panel-momstats{flex-direction:column;overflow:hidden}
#panel-momstats.active{display:flex}
.ai-chat-log{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}

.ai-msg.assistant{align-self:flex-start}

.ai-suggestions{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px;flex-shrink:0}
.ai-sug-btn{background:rgba(20,40,80,.6);border:1px solid rgba(100,130,200,.2);border-radius:14px;color:#7A90B0;font-size:11px;padding:5px 12px;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .15s}

/* ── MOBILE RESPONSIVE ──────────────────────────────────────────────────── */
@media(max-width:768px){
  #sb-close-btn{display:block!important}
  .mobile-hdr{display:flex}
  .mobile-nav{display:flex}

  body::before,body::after{position:fixed}
  .app-shell{position:relative!important;overflow:visible!important;min-height:100svh;padding-top:56px;padding-bottom:62px;z-index:auto}

  .panel.active{display:block!important}
  .team-switcher{position:relative!important;top:auto!important;left:auto!important;right:auto!important}
  .three-col{position:relative!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;display:block!important;height:auto!important;overflow:visible!important;background:transparent;border-top:none}
  .col-block{overflow:visible!important;height:auto!important;margin-bottom:6px;border-bottom:2px solid rgba(80,110,180,.2)}
  .col-block:last-child{border-bottom:none;margin-bottom:0}
  .col-hd{position:static!important}
  .match-banner{display:none!important}
  #panel-analyst.active{display:flex!important;flex-direction:column;height:auto;min-height:500px}
  #panel-analyst .ai-chat-log{min-height:250px}
  /* Pitch */
  .pitch-single{width:80%}
  .two-pitch{grid-template-columns:1fr}
  /* Donuts */
  .donut-pair{flex-wrap:wrap}
  /* Zone table */
  .zone-tbl{font-size:12px}
  /* Turnover type pills */
  .to-types{justify-content:center}
  /* Compare rows */
  .cmp-l,.cmp-r{font-size:16px}
  .cmp-m{font-size:11px;min-width:80px}
  /* Funnel */
  .f-val{font-size:20px}
}
/* PRINT HEADER (visible only when printing) */
.print-hdr{display:none;align-items:center;justify-content:space-between;padding:8px 16px 6px;border-bottom:1px solid rgba(100,130,200,.2);background:#080E20}
.print-hdr-team{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;letter-spacing:2px}
.print-hdr-score{font-family:'Roboto Mono',monospace;font-size:13px;color:#A0B8D0;text-align:center}
.print-hdr-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:2.5px;color:#D4A820;text-align:center}
/* PRINT STYLES */
@media print{
  /* Force colour backgrounds — user must also tick "Background graphics" in print dialog */
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  html,body{height:auto!important;overflow:visible!important;display:block!important;background:#070C1A!important}
  .app-shell{display:block!important;overflow:visible!important}
  .sidebar{display:none!important}
  .main-area{width:100%!important;overflow:visible!important;display:block!important}
  .tab-nav{display:none!important}
  .content{display:block!important;overflow:visible!important;height:auto!important}
  .panel{display:block!important;height:auto!important;overflow:visible!important;page-break-after:always;break-after:page}
  .panel:last-child{page-break-after:avoid;break-after:avoid}
  .three-col{display:grid!important;grid-template-columns:1fr 1fr 1fr!important;height:auto!important;overflow:visible!important}
  .col-block{overflow:visible!important;height:auto!important;background:#070C1A!important}
  .col-hd{position:static!important;background:#080E20!important}
  .match-banner{display:none!important}
  .print-hdr{display:flex!important;background:#080E20!important}
  /* Ensure pitch canvas and images render */
  canvas,img{max-width:100%!important}
}
@media(max-width:900px){.sidebar{width:175px}}

/* ── GAME DATE HELPER ───────────────────────────────────────────────────── */
function gameDate(game){
  const name=game.name||'';
  // YYMMDD (6 digits at start of filename, e.g. 241015_Match.xml)
  let m=name.match(/^(\d{2})(\d{2})(\d{2})[^0-9]/);
  if(m){const yr=+m[1],mo=+m[2],dy=+m[3];if(mo>=1&&mo<=12&&dy>=1&&dy<=31)return new Date(2000+yr,mo-1,dy);}
  // Also match YYMMDD anywhere in the name preceded by non-digit
  m=name.match(/(?:^|[^0-9])(\d{2})(\d{2})(\d{2})(?:[^0-9]|$)/);
  if(m){const yr=+m[1],mo=+m[2],dy=+m[3];if(mo>=1&&mo<=12&&dy>=1&&dy<=31)return new Date(2000+yr,mo-1,dy);}
  // ISO: YYYY-MM-DD
  m=name.match(/(\d{4})[.\-_](\d{2})[.\-_](\d{2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  // European: DD-MM-YYYY or DD/MM/YYYY
  m=name.match(/(\d{2})[-\/](\d{2})[-\/](\d{4})/);
  if(m)return new Date(+m[3],+m[2]-1,+m[1]);
  // Compact: YYYYMMDD (8 digits together)
  m=name.match(/(?:^|[^0-9])(\d{4})(\d{2})(\d{2})(?:[^0-9]|$)/);
  if(m&&+m[2]<=12&&+m[3]<=31)return new Date(+m[1],+m[2]-1,+m[3]);
  // Named month: 15Jan2024 / Jan2024 / 2024Jan15 etc
  const months={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  m=name.match(/(\d{1,2})(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)(\d{4})/i);
  if(m)return new Date(+m[3],months[m[2].toLowerCase()],+m[1]);
  m=name.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)(\d{1,2})(\d{4})/i);
  if(m)return new Date(+m[3],months[m[1].toLowerCase()],+m[2]);
  // Fall back to upload timestamp
  if(game.uploadedAt)return new Date(game.uploadedAt);
  return null;
}
function fmtDate(d){
  if(!d)return'';
  return d.toLocaleDateString('en-IE',{day:'2-digit',month:'short',year:'numeric'});
}
function dateStr(d){
  if(!d)return'';
  return d.toISOString().split('T')[0];
}

/* ── CSV / XML PARSERS ──────────────────────────────────────────────────── */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  if(!lines.length)return[];
  const headers=parseLine(lines[0]);
  const rows=[];
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim())continue;
    const vals=parseLine(lines[i]);
    const row={};
    headers.forEach((h,j)=>{row[h]=(vals[j]!==undefined?vals[j]:'');});
    if(row.Row)rows.push(row);
  }
  return rows;
}
function parseLine(line){
  const cols=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;}}
    else if(c===','&&!inQ){cols.push(cur.trim());cur='';}
    else cur+=c;
  }
  cols.push(cur.trim());
  return cols;
}
function parseXML(text){
  let doc;
  try{doc=new DOMParser().parseFromString(text,'text/xml');}catch(e){return[];}
  const rows=[];
  doc.querySelectorAll('instance').forEach(inst=>{
    const codeEl=inst.querySelector('code');
    if(!codeEl)return;
    const code=codeEl.textContent.trim();
    if(!code)return;
    const row={Row:code};
    const startEl=inst.querySelector('start');
    const endEl=inst.querySelector('end');
    if(startEl){row.Start=parseFloat(startEl.textContent)||0;}
    if(endEl){row.End=parseFloat(endEl.textContent)||0;}
    if(row.Start!==undefined&&row.End!==undefined){row.Duration=Math.max(0,row.End-row.Start);}
    inst.querySelectorAll('label').forEach(lbl=>{
      const g=lbl.querySelector('group'),t=lbl.querySelector('text');
      if(!t)return;
      const key=(g&&g.textContent.trim())||'Ungrouped',val=t.textContent.trim();
      row[key]=row[key]?row[key]+', '+val:val;
    });
    rows.push(row);
  });
  return rows;
}
function parseFile(text,filename){
  const ext=(filename||'').split('.').pop().toLowerCase();
  if(ext==='xml'||text.trimStart().startsWith('<'))return parseXML(text);
  return parseCSV(text);
}

function getKickoutsVal(row){

  const k=Object.keys(row).find(k=>k.toLowerCase().includes('kickout')||k.toLowerCase().includes('kick out')||k.toLowerCase().includes('puckout')||k.toLowerCase().includes('kick'));
  return k?row[k]:'';
}
function getShotVal(row){
  if(row['05. Shot Outcome']!==undefined&&row['05. Shot Outcome']!=='')return row['05. Shot Outcome'];
  const k=Object.keys(row).find(k=>k.toLowerCase().includes('shot outcome')||k.toLowerCase().includes('shot result')||(k.toLowerCase().includes('shot')&&k.toLowerCase().includes('outcome')));
  return k?row[k]:'';
}
function parsePuckoutNew(row){
  const ko=(row['03. Kickouts']||'').trim();
  const seq=(row['09. Start Sequence']||'').trim();
  const ao=(row['08. Attack Outcome']||'').trim();
  if(!ko&&!seq&&!ao)return null;
  const puckoutTeam=(row.Row||'').replace(/\s+Puckout\*?$/,'').trim();
  const kl=ko.toLowerCase();
  const aol=ao.toLowerCase();
  // Build full real team name list: combine teams[] with actual opposition names
  const allKnownTeams=[...new Set([...teams,...oppositionTeamNames])].filter(t=>t&&t!=='Opposition');
  const findWinner=(str,suf)=>allKnownTeams.find(t=>str.includes(t+(suf||'')))||null;
  let winOutcome='Unknown',winner='';
  if(kl.includes('won clean')){
    winOutcome='Won Clean';winner=findWinner(ko,' Won Clean')||puckoutTeam;
  } else if(kl.includes('won break')){
    winOutcome='Won Break';winner=findWinner(ko,' Won Break')||puckoutTeam;
  } else if(kl.includes('won')){
    winOutcome='Won';winner=findWinner(ko,' Won')||puckoutTeam;
  } else if((kl.includes('lost')||kl.includes('error'))&&!kl.includes('gz')&&!kl.includes('kicked dead')){
    // "Leixlip Lost, Other" / "Error" label = puckout was lost (opposition won, no explicit winner)
    winOutcome='ErrorLost';winner='';
  } else if(kl.includes('gz failure')||kl.includes('gzf')||aol.includes('gz failure')||kl.includes('kicked dead')){
    winOutcome='Error';winner='';
  } else if(ko){
    return null;
  } else {
    const sl=seq.toLowerCase();
    const wt=allKnownTeams.find(t=>t&&seq.includes(t));
    if(sl.includes('won')){winOutcome='Won';winner=wt||puckoutTeam;}
    else return null;
  }
  const isWon=(winner===puckoutTeam);
  const outcome=isWon?winOutcome:
    (winOutcome==='Error'?'Error':
     winOutcome==='ErrorLost'?'ErrorLost':
     winOutcome==='Won Clean'?'Lost Clean':
     winOutcome==='Won Break'?'Lost Break':'Lost');
  let dist='';
  if(kl.includes('long'))dist='Long';
  else if(kl.includes('mid')||kl.includes('middle'))dist='Mid';
  else if(kl.includes('short'))dist='Short';
  return{dist,outcome,winner,isWon};
}
function parseShotOutcome(field){
  if(!field)return'Unknown';
  if(field.includes('Goal'))return'Goal';
  if(field.includes('2-Point')||field.includes('2 Point'))return'2Point';
  if(field.includes('Point'))return'Point';
  if(field.includes('Wide'))return'Wide';
  if(field.includes('Short'))return'Short';
  if(field.includes('Save')||field.includes('Saved'))return'Save';
  if(field.includes('Blocked')||field.includes('Block'))return'Blocked';
  if(field.includes('Post'))return'Post';
  if(field.includes('65'))return'65m';
  return'Other';
}
function parseTurnoverMeta(ungrouped){
  const zone=ungrouped.includes('Attacking 3rd')?'Attacking 3rd':ungrouped.includes('Middle 3rd')?'Middle 3rd':ungrouped.includes('Defensive 3rd')?'Defensive 3rd':'Unknown';
  const TYPES=['Puck Pass','Hand Pass','Handling','Tackles','Shots','Set Piece','5050'];
  const type=TYPES.find(t=>ungrouped.includes(t))||'Other';
  const hasUnforced=ungrouped.includes('Unforced');
  const hasForced=!hasUnforced&&(ungrouped.includes('Forced'));
  const forced=hasForced?'Forced':hasUnforced?'Unforced':'Unknown';
  return{zone,type,forced};
}

/* ── TEAM DETECTION ─────────────────────────────────────────────────────── */
function detectTeams(rows){
  const found=new Set();
  rows.forEach(r=>{
    const m=r.Row&&r.Row.match(/^(.+?)\s+Puckout\*?$/);
    if(m)found.add(m[1].trim());
  });
  const arr=[...found].slice(0,2);
  if(arr.length<2){
    rows.forEach(r=>{
      const m=r.Row&&r.Row.match(/^(.+?)\s+Possession$/);
      if(m)found.add(m[1].trim());
    });
    arr.splice(0,arr.length,...[...found].slice(0,2));
  }
  arr.sort();
  return arr;
}
function getActiveRows(){
  if(selectedGames.size===0)return games.flatMap(g=>g.rows);
  return games.filter((_,i)=>selectedGames.has(i)).flatMap(g=>g.rows);
}
function getHalfRows(rows,half){
  if(half==='h1')return rows.filter(r=>r.Half&&r.Half.includes('First Half'));
  if(half==='h2')return rows.filter(r=>r.Half&&r.Half.includes('Second Half'));
  return rows;
}

/* ── DETECT ALL TEAMS (no 2-team cap, for multi-game opposition aggregation) */
function detectAllTeams(rows){
  const found=new Set();
  rows.forEach(r=>{
    const m=r.Row&&r.Row.match(/^(.+?)\s+Puckout\*?$/);
    if(m)found.add(m[1].trim());
  });
  if(found.size<1){
    rows.forEach(r=>{
      const m=r.Row&&r.Row.match(/^(.+?)\s+Possession$/);
      if(m)found.add(m[1].trim());
    });
  }
  return[...found].sort();
}

/* ── COMPUTE STATS ──────────────────────────────────────────────────────── */
function computeStats(rows,team){
  // Opposition = aggregate ALL non-home teams across multiple games
  let teamNames,opp;
  if(team==='Opposition'){
    const homeTeam=teams.find(t=>t!=='Opposition')||'';
    // Use the globally maintained oppositionTeamNames list (populated per active-game selection)
    teamNames=oppositionTeamNames.length?oppositionTeamNames:detectAllTeams(rows).filter(t=>t!==homeTeam);
    if(!teamNames.length)teamNames=detectAllTeams(rows).slice(0,1);
    opp=homeTeam;
  }else{
    teamNames=[team];
    opp=teams.find(t=>t!==team)||'';
  }
  // Row helpers: match any of the teamNames or the single opp
  const ft=suf=>rows.filter(r=>teamNames.some(tn=>r.Row===tn+suf));
  // fo: if opp is the synthetic 'Opposition' label, match against all real opposition team names
  const oppNames2=opp==='Opposition'?oppositionTeamNames:[opp];
  const fo=suf=>rows.filter(r=>oppNames2.some(tn=>r.Row===tn+suf));
  const _poStar=ft(' Puckout*');
  const puckouts=_poStar.length>0?_poStar:ft(' Puckout');
  const _oppStar=fo(' Puckout*');
  const oppPO=_oppStar.length>0?_oppStar:fo(' Puckout');
  const allPO=[...puckouts,...oppPO];
  // isWon already checks the serving team won it; winner falls back to puckoutTeam from row
  const ownWon=puckouts.filter(r=>{const p=parsePuckoutNew(r);return p&&p.isWon;}).length;
  const wonClean=puckouts.filter(r=>{const p=parsePuckoutNew(r);return p&&p.outcome==='Won Clean';}).length;
  const wonBreak=puckouts.filter(r=>{const p=parsePuckoutNew(r);return p&&p.outcome==='Won Break';}).length;
  // poError = GZ failures + "Error"-labelled lost puckouts (both shown in ERROR stat and data panel)
  const poError=puckouts.filter(r=>{const p=parsePuckoutNew(r);return p&&(p.outcome==='Error'||p.outcome==='ErrorLost');}).length;
  // totalWon: home team explicitly named as winner, OR opp puckout was not won (Lost/ErrorLost/GZ Error = other team gets credit)
  const oppPOSet=new Set(oppPO);
  const totalWon=allPO.filter(r=>{const p=parsePuckoutNew(r);if(!p)return false;if(teamNames.some(tn=>p.winner===tn))return true;if(oppPOSet.has(r)&&(p.outcome==='Lost'||p.outcome==='ErrorLost'||p.outcome==='Error'))return true;return false;}).length;
  const oppWon=allPO.filter(r=>{const p=parsePuckoutNew(r);if(!p)return false;if(oppNames2.some(tn=>p.winner===tn))return true;if(!oppPOSet.has(r)&&(p.outcome==='Lost'||p.outcome==='ErrorLost'||p.outcome==='Error'))return true;return false;}).length;
  // Denominator: all real puckout events — include GZ errors (they are real puckout events even if no one wins)
  const validPOLen=allPO.filter(r=>{const p=parsePuckoutNew(r);return p!=null;}).length;
  const ownBallPct=puckouts.length>0?Math.round(ownWon/puckouts.length*100):0;
  const totalPOPct=validPOLen>0?Math.round(totalWon/validPOLen*100):0;
  const sfPlay=ft(' Shot from Play');
  const sfFreeRaw=ft(' Shot from Free');
  const sf65=ft(' 65');
  const sfLineball=ft(' Shot from Lineball');
  const sfFree=[...sfFreeRaw,...sf65,...sfLineball];
  const co=o=>sfPlay.filter(r=>parseShotOutcome(getShotVal(r))===o).length;
  const cof=o=>sfFree.filter(r=>parseShotOutcome(getShotVal(r))===o).length;
  const playGoals=co('Goal'),playPts=co('Point'),playWide=co('Wide'),playShort=co('Short'),playSave=co('Save'),playPost=co('Post'),playBlocked=co('Blocked'),play65=co('65m');
  const freeGoals=cof('Goal'),freePts=cof('Point'),freeWide=cof('Wide'),freeShort=cof('Short'),freeSave=cof('Save'),freePost=cof('Post'),freeBlocked=cof('Blocked'),free65=cof('65m');
  const tGoals=playGoals+freeGoals,tPts=playPts+freePts,tScore=tGoals*3+tPts;
  const fromPlayConv=sfPlay.length>0?Math.round((playGoals+playPts)/sfPlay.length*100):0;
  const deadBallConv=sfFree.length>0?Math.round((freeGoals+freePts)/sfFree.length*100):0;
  const totalShots=sfPlay.length+sfFree.length;
  const totalConv=totalShots>0?Math.round((tGoals+tPts)/totalShots*100):0;
  const poss=ft(' Possession').length;
  const sumDur=arr=>arr.reduce((a,r)=>{let d=parseFloat(r.Duration)||0;if(!d&&r.End&&r.Start)d=Math.max(0,parseFloat(r.End)-parseFloat(r.Start));return a+d;},0);
  const possSecs=sumDur(ft(' Possession'));
  const oppPossSecs=sumDur(fo(' Possession'));
  const bipSecs=possSecs+oppPossSecs;
  const attacks=ft(' Attack').length;
  const scores=tGoals+tPts;
  const pp10p=poss>0?(tScore/poss*10).toFixed(2):'0.00';
  const toLost=ft(' Turnover').length;
  const toWon=fo(' Turnover').length;
  const toRows=ft(' Turnover');
  const forced=toRows.filter(r=>{const seq=r.Ungrouped||'';const m=parseTurnoverMeta(seq);return m.forced==='Forced';}).length;
  const unforced=toLost-forced;
  const forcedPct=toLost>0?Math.round(forced/toLost*100):0;
  const freeConRows=ft(' Free Conceded');
  const freeCon=freeConRows.length;
  const scorable=freeConRows.filter(r=>{
    const disc=(r['02. Discipline']||r.Ungrouped||'').trim();
    return disc==='Scorable';
  }).length;
  const scorablePct=freeCon>0?Math.round(scorable/freeCon*100):0;
  // Use duration (seconds) for possession %, consistent with BIP time display
  const posPct=()=>bipSecs>0?Math.round(possSecs/bipSecs*100):0;
  return{puckouts:puckouts.length,ownWon,wonClean,wonBreak,poError,ownBallPct,totalWon,oppWon,totalPOPct,
    sfPlay:sfPlay.length,sfFree:sfFree.length,playGoals,playPts,playWide,playShort,playSave,playPost,playBlocked,play65,
    freeGoals,freePts,freeWide,freeShort,freeSave,freePost,freeBlocked,free65,
    tGoals,tPts,tScore,fromPlayConv,deadBallConv,totalConv,totalShots,
    poss,possSecs,oppPossSecs,bipSecs,attacks,scores,pp10p,posPct:posPct(),
    toLost,toWon,forced,unforced,forcedPct,freeCon,scorable,scorablePct,
    puckoutRows:puckouts,sfPlayRows:sfPlay,sfFreeRows:sfFree,toRows,freeConRows};
}

/* ── CANVAS SETUP ───────────────────────────────────────────────────────── */
function setupOverlay(canvas){
  const dpr=window.devicePixelRatio||1;
  const w=canvas.offsetWidth||200,h=canvas.offsetHeight||280;
  canvas.width=w*dpr;canvas.height=h*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
  return{ctx,w,h};
}
function setupCanvas(canvas){
  const dpr=window.devicePixelRatio||1;
  const w=canvas.offsetWidth||80,h=canvas.offsetHeight||80;
  canvas.width=w*dpr;canvas.height=h*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  return{ctx,w,h};
}
function fullPitchMapper(w,h,invertY){
  const{left,right,top,bottom}=BOUNDS_FULL;
  const px=dataX=>left*w+(dataX/90)*(right-left)*w;
  const py=invertY?dataY=>top*h+(dataY/140)*(bottom-top)*h:dataY=>top*h+(1-dataY/140)*(bottom-top)*h;
  return{px,py};
}
function halfPitchMapper(w,h){
  const{left,right}=BOUNDS_HTOP;
  const top=0.05, mid=0.70;
  const px=dataX=>left*w+(dataX/90)*(right-left)*w;
  const py=dataY=>top*h+(1-(dataY-70)/70)*(mid-top)*h;
  return{px,py};
}
function isLightTheme(){return document.documentElement.getAttribute('data-theme')==='light';}
function themeVal(dark,light){return isLightTheme()?light:dark;}
function drawDonut(ctx,cx,cy,r,pct,color,bg){
  const tau=Math.PI*2,s=-Math.PI/2;
  ctx.beginPath();ctx.arc(cx,cy,r,0,tau);
  ctx.strokeStyle=bg||'rgba(255,255,255,.08)';ctx.lineWidth=r*0.28;ctx.stroke();
  if(pct>0){
    ctx.beginPath();ctx.arc(cx,cy,r,s,s+tau*(Math.min(pct,100)/100));
    ctx.strokeStyle=color;ctx.lineWidth=r*0.28;ctx.stroke();
  }
  ctx.fillStyle=isLightTheme()?'#1A2030':'#E2E8F5';ctx.font=`bold ${Math.round(r*0.54)}px 'Barlow Condensed'`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(pct+'%',cx,cy);
}
function drawPuckoutOverlay(canvas,puckRows,team,half,mode){
  if(!canvas)return;
  mode=mode||'dots';
  const{ctx,w,h}=setupOverlay(canvas);
  const{px,py}=fullPitchMapper(w,h,false);
  const DOT_COLOR={'Won Clean':'#1a9e4a','Won Break':'#5dca80','Won':'#2ECC71',
                   'Lost Clean':'#7a0000','Lost Break':'#c94040','Lost':'#E74C3C','Error':'#222222'};
  puckRows.forEach(r=>{
    const{x,y}=getCanvasXY(r,half||'all');if(x===null||y===null)return;
    const p=parsePuckoutNew(r);
    if(!p)return;
    const col=DOT_COLOR[p.outcome]||'#808080';
    const cx=px(Math.min(Math.max(x,0),90)),cy=py(Math.min(Math.max(y,0),140));
    if(mode==='heat'){drawHeatBlob(ctx,cx,cy,col);}
    else{
      ctx.beginPath();ctx.arc(cx,cy,4.5,0,Math.PI*2);
      ctx.fillStyle=col;ctx.globalAlpha=0.9;ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=0.8;ctx.stroke();
    }
  });
  ctx.globalAlpha=1;
}
function drawShotOverlay(canvas,playRows,freeRows,half,mode){
  if(!canvas)return;
  mode=mode||'dots';
  const{ctx,w,h}=setupOverlay(canvas);
  const{px,py}=halfPitchMapper(w,h);
  const draw=(rows)=>{
    rows.forEach(r=>{
      const{x,y}=getCanvasXY(r,half||'all');if(x===null||y===null)return;
      const out=parseShotOutcome(getShotVal(r));
      const colors={Goal:'#2ECC71',Point:'#FFFFFF','2Point':'#F97316',Wide:'#E74C3C',Short:'#333333',Save:'#333333',Blocked:'#333333',Post:'#333333','65m':'#808080'};
      const col=colors[out]||'#7F8C8D';
      const cx=px(Math.min(Math.max(x,0),90)),cy=py(Math.min(Math.max(y,36),140));
      if(mode==='heat'){drawHeatBlob(ctx,cx,cy,col);}
      else{
        ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);
        ctx.fillStyle=col;ctx.globalAlpha=0.9;ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=0.8;ctx.stroke();
      }
    });
  };
  draw(playRows);draw(freeRows);
  ctx.globalAlpha=1;
}
function drawTurnoverOverlay(canvas,toRows,freeRows,half,toCol,mode){
  if(!canvas)return;
  mode=mode||'dots';
  const{ctx,w,h}=setupOverlay(canvas);
  const{px,py}=fullPitchMapper(w,h,false);
  // Turnovers: uniform navy colour
  toRows.forEach(r=>{
    const{x,y}=getCanvasXY(r,half||'all');if(x===null||y===null)return;
    const cx=px(Math.min(Math.max(x,0),90)),cy=py(Math.min(Math.max(y,0),140));
    if(mode==='heat'){drawHeatBlob(ctx,cx,cy,'#4A7CCC');}
    else{
      ctx.beginPath();ctx.arc(cx,cy,4.5,0,Math.PI*2);
      ctx.fillStyle='#1A3A6E';ctx.globalAlpha=0.95;ctx.fill();
      ctx.strokeStyle='rgba(100,160,255,0.5)';ctx.lineWidth=1;ctx.stroke();
    }
  });
  // Frees conceded: uniform red
  freeRows.forEach(r=>{
    const{x,y}=getCanvasXY(r,half||'all');if(x===null||y===null)return;
    const cx=px(Math.min(Math.max(x,0),90)),cy=py(Math.min(Math.max(y,0),140));
    if(mode==='heat'){drawHeatBlob(ctx,cx,cy,'#E74C3C');}
    else{
      ctx.beginPath();ctx.arc(cx,cy,4.5,0,Math.PI*2);
      ctx.fillStyle='#E74C3C';ctx.globalAlpha=0.85;ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=0.8;ctx.stroke();
    }
  });
  ctx.globalAlpha=1;
}

/* ── HEATMAP HELPERS ────────────────────────────────────────────────────── */
function hexToRgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}
function drawHeatBlob(ctx,x,y,col,r){
  r=r||22;
  const grd=ctx.createRadialGradient(x,y,0,x,y,r);
  grd.addColorStop(0,hexToRgba(col,0.85));
  grd.addColorStop(0.45,hexToRgba(col,0.45));
  grd.addColorStop(1,hexToRgba(col,0));
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=grd;ctx.globalAlpha=1;ctx.fill();
}

/* ── SCORE / SIDEBAR ────────────────────────────────────────────────────── */
function calcScore(rows,team){
  let teamNames;
  if(team==='Opposition'){
    const homeTeam=teams.find(t=>t!=='Opposition')||'';
    teamNames=oppositionTeamNames.length?oppositionTeamNames:detectAllTeams(rows).filter(t=>t!==homeTeam);
    if(!teamNames.length)teamNames=[];
  }else{
    teamNames=[team];
  }
  const ft=suf=>rows.filter(r=>teamNames.some(tn=>r.Row===tn+suf));
  const all=[...ft(' Shot from Play'),...ft(' Shot from Free'),...ft(' 65'),...ft(' Shot from Lineball')];
  const G=all.filter(r=>parseShotOutcome(getShotVal(r))==='Goal').length;
  const P=all.filter(r=>parseShotOutcome(getShotVal(r))==='Point').length;
  const twoPt=all.filter(r=>parseShotOutcome(getShotVal(r))==='2Point').length;
  return{G,P,twoPt,total:G*3+P+twoPt*2};
}

/* ── GAME FILTER ────────────────────────────────────────────────────────── */
function updateGameFilterUI(){
  ['all','last3','last5'].forEach(id=>{
    const el=document.getElementById('gf-'+id);
    if(el)el.classList.toggle('active',gameFilterType===id);
  });
  // If range filter active, quick buttons are all inactive
  if(gameFilterType==='range'){
    ['all','last3','last5'].forEach(id=>{
      const el=document.getElementById('gf-'+id);
      if(el)el.classList.remove('active');
    });
  }
}
function applySelectionAndRender(){
  const activeRows=getActiveRows();
  const activeGames=selectedGames.size===0?games:games.filter((_,i)=>selectedGames.has(i));
  const multiGame=activeGames.length>1;
  let homeTeam=null;
  if(multiGame){
    // Find the team present in every active game (the club's own team)
    const tpg=activeGames.map(g=>detectTeams(g.rows));
    if(tpg.length>0){
      const cands=tpg[0];
      homeTeam=cands.find(t=>tpg.every(gt=>gt.includes(t)))||null;
    }
    if(!homeTeam){
      // Fallback: most frequently occurring team across games
      const cnt={};
      activeGames.forEach(g=>detectTeams(g.rows).forEach(t=>{cnt[t]=(cnt[t]||0)+1;}));
      const sorted=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
      homeTeam=sorted[0]?.[0]||null;
    }
  }
  if(homeTeam){
    const prevColor0=teamColors[homeTeam]||teamColors[teams[0]]||T_COLORS[0];
    const prevColor1=teamColors['Opposition']||teamColors[teams[1]]||T_COLORS[1];
    teams=[homeTeam,'Opposition'];
    teamColors={[homeTeam]:prevColor0,'Opposition':prevColor1};
    currentViewTeam=0;
    document.getElementById('sb-teams-section').style.display='';
    // Build definitive list of opposition team names from each active game
    const oppSet=new Set();
    activeGames.forEach(g=>{detectTeams(g.rows).forEach(t=>{if(t!==homeTeam)oppSet.add(t);});});
    oppositionTeamNames=[...oppSet].sort();
  } else {
    oppositionTeamNames=[];
    const newTeams=detectTeams(activeRows);
    if(newTeams.length>=2){
      teams=newTeams;
      teamColors={[teams[0]]:teamColors[newTeams[0]]||T_COLORS[0],[teams[1]]:teamColors[newTeams[1]]||T_COLORS[1]};
      currentViewTeam=0;
      document.getElementById('sb-teams-section').style.display='';
    }
  }
  updateFilterBar();renderAll();
}
function setGameFilter(type,n){
  if(type==='all'){
    gameFilterType='all';
    selectedGames.clear();
    const fromEl=document.getElementById('gf-from'),toEl=document.getElementById('gf-to');
    if(fromEl)fromEl.value='';if(toEl)toEl.value='';
  } else if(type==='last'){
    gameFilterType='last'+(n||3);
    // Sort by effective date descending
    const sorted=[...games].map((g,i)=>({i,d:gameDate(g)||new Date(0)})).sort((a,b)=>b.d-a.d);
    selectedGames.clear();
    sorted.slice(0,n||3).forEach(({i})=>selectedGames.add(i));
    const fromEl=document.getElementById('gf-from'),toEl=document.getElementById('gf-to');
    if(fromEl)fromEl.value='';if(toEl)toEl.value='';
  } else if(type==='range'){
    gameFilterType='range';
    const from=(document.getElementById('gf-from')||{}).value||'';
    const to=(document.getElementById('gf-to')||{}).value||'';
    selectedGames.clear();
    games.forEach((g,i)=>{
      const d=gameDate(g);
      const ds=d?dateStr(d):'';
      const afterFrom=!from||!ds||(ds>=from);
      const beforeTo=!to||!ds||(ds<=to);
      if(afterFrom&&beforeTo)selectedGames.add(i);
    });
  }
  updateGameFilterUI();
  applySelectionAndRender();
}

/* ── FILTER BAR ─────────────────────────────────────────────────────────── */
function toggleGameCheck(gameIdx,checked){
  if(gameIdx<0)return;
  if(selectedGames.size===0){
    // Was "all selected"; expand to explicit set, then toggle
    games.forEach((_,i)=>selectedGames.add(i));
  }
  if(checked)selectedGames.add(gameIdx);
  else selectedGames.delete(gameIdx);
  // If everything selected, collapse back to "all" mode
  if(selectedGames.size>=games.length)selectedGames.clear();
  gameFilterType='manual';
  updateGameFilterUI();
  applySelectionAndRender();
}
function updateFilterBar(){
  const bar=document.getElementById('filter-bar');

  const sortedIdxs=[...games.keys()].sort((a,b)=>{
    const da=gameDate(games[a])||new Date(0);

        ${label}${dateStr2?`<br><span class="gf-game-date">${dateStr2}</span>`:''}
      </label>

  bar.innerHTML=html;
}

/* ── MOMENTUM RENDER ────────────────────────────────────────────────────── */
function hexAlpha(hex,a){
  if(!hex||hex.length<7)return`rgba(180,180,180,${a})`;
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgba(${r},${g},${b},${a})`;
}
function renderMomentum(){
  const panel=document.getElementById('panel-momentum');
  if(!teams.length){showEmpty();return;}
  const allRows=getActiveRows();
  const c0=teamColors[teams[0]]||T_COLORS[0];
  const c1=teamColors[teams[1]]||T_COLORS[1];
  const evs=[];
  // In multi-game opposition mode, use real team names for matching
  const t0=teams[0];
  const isOppMode=teams[1]==='Opposition'&&oppositionTeamNames.length>0;
  const oppNames=isOppMode?oppositionTeamNames:[teams[1]];
  allRows.forEach(r=>{
    const t=parseFloat(r.Start);
    if(isNaN(t)||t<0)return;
    // Tag with half (1 or 2) for timestamp normalisation
    const halfTag=r.Half&&r.Half.includes('First')?1:r.Half&&r.Half.includes('Second')?2:0;
    let handled=false;
    // Home team (idx 0)
    if(!handled&&(r.Row===t0+' Shot from Play'||r.Row===t0+' Shot from Free'||r.Row===t0+' 65'||r.Row===t0+' Shot from Lineball')){
      const out=parseShotOutcome(getShotVal(r));
      const pts=out==='Goal'?3:out==='2Point'?2:out==='Point'?1:0;
      evs.push({t,half:halfTag,teamIdx:0,type:out==='Goal'?'goal':pts>0?'point':'miss',pts,outcome:out,is2pt:out==='2Point'});
      handled=true;
    }
    // Opposition / team 1 (idx 1) — match against all real opposition names
    if(!handled){
      const matchedOpp=oppNames.find(tn=>r.Row===tn+' Shot from Play'||r.Row===tn+' Shot from Free'||r.Row===tn+' 65'||r.Row===tn+' Shot from Lineball');
      if(matchedOpp){
        const out=parseShotOutcome(getShotVal(r));
        const pts=out==='Goal'?3:out==='2Point'?2:out==='Point'?1:0;
        evs.push({t,half:halfTag,teamIdx:1,type:out==='Goal'?'goal':pts>0?'point':'miss',pts,outcome:out,is2pt:out==='2Point'});
        handled=true;
      }
    }
    if(!handled){
      if(r.Row===t0+' Free Conceded')evs.push({t,half:halfTag,teamIdx:0,type:'freeconceded',pts:0,outcome:'FreeConceded'});
      else if(oppNames.some(tn=>r.Row===tn+' Free Conceded'))evs.push({t,half:halfTag,teamIdx:1,type:'freeconceded',pts:0,outcome:'FreeConceded'});
    }
  });
  evs.sort((a,b)=>a.t-b.t);
  if(!evs.length){
    panel.innerHTML=`<div class="empty"><div class="empty-icon">📈</div><h2>NO TIMELINE DATA</h2><p style="color:#6A7FA8;font-size:13px;margin-top:6px">Momentum requires Start timecodes in the XML data.</p><p style="color:#4A5F88;font-size:12px;margin-top:4px">CSV files may not include timing information.</p></div>`;
    return;
  }
  // ── Normalise timestamps so each half starts at 0:00 game time ──────────
  // This removes video-recording dead time before the throw-in.
  // Only applied when events carry half tags (XML files); CSV falls back to raw times.
  const h1Tagged=evs.filter(e=>e.half===1);
  const h2Tagged=evs.filter(e=>e.half===2);
  let halfT;
  if(h1Tagged.length>0||h2Tagged.length>0){
    const h1Min=h1Tagged.length?Math.min(...h1Tagged.map(e=>e.t)):evs[0].t;
    const h1MaxRaw=h1Tagged.length?Math.max(...h1Tagged.map(e=>e.t)):h1Min;
    const h1Dur=Math.max(0,h1MaxRaw-h1Min);
    const h2Min=h2Tagged.length?Math.min(...h2Tagged.map(e=>e.t)):h1MaxRaw;
    // Shift h1 events so first h1 event = t 0
    // Shift h2 events so first h2 event = t h1Dur (seamless after h1)
    evs.forEach(e=>{
      if(e.half===2)e.t=(e.t-h2Min)+h1Dur;
      else if(e.half===1)e.t=e.t-h1Min;
      // half===0 (untagged): leave raw; they'll land somewhere on the line
    });
    halfT=h1Dur;
  }else{
    halfT=Math.max(60,...evs.map(e=>e.t))/2;
  }
  const maxT=Math.max(60,...evs.map(e=>e.t));
  const maxM=Math.ceil(maxT/60);
  // Cache for TIME STATS tab
  _momData={evs,maxT,halfT,maxM,c0,c1};
  function pScore(tLo,tHi){
    const g=[0,0],p=[0,0],w=[0,0],fc=[0,0];
    evs.forEach(e=>{
      if(e.t<tLo||e.t>tHi)return;
      if(e.type==='goal'){g[e.teamIdx]++;}
      else if(e.type==='point'){p[e.teamIdx]+=(e.is2pt?2:1);}
      else if(e.type==='miss'&&e.outcome==='Wide'){w[e.teamIdx]++;}
      else if(e.type==='freeconceded'){fc[e.teamIdx]++;}
    });
    return[g,p,w,fc];
  }
  function fmtGS(g,p){return`${g}-${String(p).padStart(2,'0')}`;}
  function buildLine(tLo,tHi){
    const s=[0,0];const line=[{t:tLo,diff:0}];
    evs.forEach(e=>{if(e.t>=tLo&&e.t<=tHi&&e.pts>0){s[e.teamIdx]+=e.pts;line.push({t:e.t,diff:s[0]-s[1]});}});
    line.push({t:tHi,diff:s[0]-s[1]});return line;
  }
  function sHdr(label,tLo,tHi){
    const[g,p]=pScore(tLo,tHi);
    return`<div style="display:flex;align-items:center;gap:10px;padding:2px 0 5px;flex-shrink:0">
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;letter-spacing:2px;color:${themeVal('#4A5F88','#6B7280')};text-transform:uppercase;white-space:nowrap">${label}</span>
      <span style="flex:1;height:1px;background:${themeVal('rgba(100,130,200,.15)','rgba(0,0,0,.1)')}"></span>
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;color:${c0}">${teams[0]}&nbsp;${fmtGS(g[0],p[0])}</span>
      <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:${themeVal('#3A5070','#9CA3AF')};margin:0 2px">–</span>
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;color:${c1}">${fmtGS(g[1],p[1])}&nbsp;${teams[1]}</span>
    </div>`;
  }
  panel.innerHTML=`<div class="print-hdr" id="ph-momentum"></div>
  <div style="padding:8px 16px 4px;flex-shrink:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;letter-spacing:2px;color:${themeVal('#FFFFFF','#1A2030')};text-transform:uppercase">MOMENTUM</div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:12px;color:${themeVal('#4A5F88','#6B7280')};flex:1">${evs.length} events · ${Math.round(maxT/60)} mins</div>
    <div style="display:flex;gap:5px">
      <button onclick="setMomentumStyle('dots')" style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;padding:3px 10px;border-radius:3px;border:1px solid ${momentumMarkerStyle==='dots'?'#4A7CCC':'rgba(100,130,200,0.3)'};background:${momentumMarkerStyle==='dots'?'rgba(74,124,204,0.2)':'transparent'};color:${momentumMarkerStyle==='dots'?'#FFFFFF':'#6A80A8'};cursor:pointer">DOTS</button>
      <button onclick="setMomentumStyle('flags')" style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;padding:3px 10px;border-radius:3px;border:1px solid ${momentumMarkerStyle==='flags'?'#4A7CCC':'rgba(100,130,200,0.3)'};background:${momentumMarkerStyle==='flags'?'rgba(74,124,204,0.2)':'transparent'};color:${momentumMarkerStyle==='flags'?'#FFFFFF':'#6A80A8'};cursor:pointer">FLAGS</button>
    </div>
  </div>
  <div style="flex:1;overflow-y:auto;min-height:0;padding:0 14px 10px">
    ${sHdr('FIRST HALF',0,halfT)}
    <canvas id="mom-c1" style="width:100%;display:block;margin-bottom:18px"></canvas>
    ${sHdr('SECOND HALF',halfT,maxT)}
    <canvas id="mom-c2" style="width:100%;display:block;margin-bottom:18px"></canvas>
    ${sHdr('FULL GAME',0,maxT)}
    <canvas id="mom-cf" style="width:100%;display:block;margin-bottom:4px"></canvas>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;padding:6px 12px 10px;border-top:1px solid ${themeVal('rgba(100,130,200,.1)','rgba(0,0,0,.08)')};flex-shrink:0">
    <span style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:${themeVal('#B0C4DC','#6B7280')};display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:14px;height:3px;background:${c0};border-radius:2px"></span>${teams[0]}</span>
    <span style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:${themeVal('#B0C4DC','#6B7280')};display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:14px;height:3px;background:${c1};border-radius:2px"></span>${teams[1]}</span>
    <span style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:${themeVal('#B0C4DC','#6B7280')};display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#2ECC71;flex-shrink:0"></span>Goal</span>

function renderMomStats(){

  if(!panel)return;
  if(!teams.length){panel.innerHTML=`<div class="empty"><div class="empty-icon">⏱</div><h2>NO DATA</h2><p style="color:#6A7FA8;font-size:13px;margin-top:6px">Load a file to see time-filtered stats.</p></div>`;return;}
  // Ensure momentum data is cached
  if(!_momData){renderMomentum();}
  if(!_momData||!_momData.evs.length){panel.innerHTML=`<div class="empty"><div class="empty-icon">⏱</div><h2>NO TIMELINE DATA</h2><p style="color:#6A7FA8;font-size:13px;margin-top:6px">Time stats require Start timecodes in the XML data.</p></div>`;return;}
  const {evs,maxT,halfT,maxM,c0,c1}=_momData;
  function pscore(tLo,tHi){
    const g=[0,0],p=[0,0],w=[0,0],fc=[0,0];
    evs.forEach(e=>{
      if(e.t<tLo||e.t>tHi)return;
      if(e.type==='goal'){g[e.teamIdx]++;}
      else if(e.type==='point'){p[e.teamIdx]+=(e.is2pt?2:1);}
      else if(e.type==='miss'&&e.outcome==='Wide'){w[e.teamIdx]++;}
      else if(e.type==='freeconceded'){fc[e.teamIdx]++;}
    });
    return[g,p,w,fc];
  }
  function fmtgs(g,p){return`${g}-${String(p).padStart(2,'0')}`;}
  panel.innerHTML=`
  <div style="padding:14px 18px 10px;flex-shrink:0;border-bottom:1px solid ${themeVal('rgba(80,110,180,.2)','rgba(0,0,0,.1)')}">

  <div style="flex:1;overflow-y:auto;min-height:0;padding:18px 18px 18px">
    <div style="background:${themeVal('rgba(12,22,44,.7)','rgba(240,244,250,.9)')};border:1px solid ${themeVal('rgba(80,110,180,.25)','rgba(0,0,0,.1)')};border-radius:10px;padding:18px 20px 20px;margin-bottom:18px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;letter-spacing:2.5px;color:${themeVal('#7A94BA','#6B7280')};text-transform:uppercase;margin-bottom:14px">SELECT TIME PERIOD</div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-family:'Barlow Condensed',sans-serif;font-size:12px;color:${themeVal('#8AA0C0','#6B7280')};margin-bottom:4px;padding:0 2px">
        <span>0'</span><span>${Math.round(halfT/60)}'&nbsp;(HT)</span><span>${maxM}'</span>
      </div>
      <div style="position:relative;height:40px;margin:0 2px 4px">
        <div style="position:absolute;top:50%;transform:translateY(-50%);left:0;right:0;height:5px;background:rgba(100,130,200,.15);border-radius:3px"></div>
        <div id="mst-fill" style="position:absolute;top:50%;transform:translateY(-50%);height:5px;background:linear-gradient(90deg,rgba(${parseInt(c0.slice(1,3),16)},${parseInt(c0.slice(3,5),16)},${parseInt(c0.slice(5,7),16)},.5),rgba(${parseInt(c1.slice(1,3),16)},${parseInt(c1.slice(3,5),16)},${parseInt(c1.slice(5,7),16)},.5));border-radius:3px;left:0%;right:0%"></div>
        <div style="position:absolute;top:50%;transform:translateY(-50%);left:${Math.round((halfT/maxT)*100)}%;width:1px;height:14px;background:rgba(180,200,220,.25)"></div>
        <input type="range" id="mst-lo" min="0" max="${maxM}" value="0" step="1" style="position:absolute;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0;left:0;top:0;z-index:3">
        <input type="range" id="mst-hi" min="0" max="${maxM}" value="${maxM}" step="1" style="position:absolute;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0;left:0;top:0;z-index:3">
        <div id="mst-th-lo" style="position:absolute;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:${c0};border:2px solid rgba(8,20,44,.95);pointer-events:none;box-shadow:0 0 8px rgba(0,0,0,.7);left:0%;z-index:4"></div>
        <div id="mst-th-hi" style="position:absolute;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:${c1};border:2px solid rgba(8,20,44,.95);pointer-events:none;box-shadow:0 0 8px rgba(0,0,0,.7);left:100%;z-index:4"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-family:'Barlow Condensed',sans-serif;margin:0 2px">
        <span id="mst-lo-lbl" style="font-size:15px;color:${themeVal('#A0BAD8','#6B7280')};font-weight:700">0'</span>
        <span id="mst-range-lbl" style="font-weight:900;color:${themeVal('#FFFFFF','#1A2030')};font-size:17px;letter-spacing:1.5px">FULL GAME</span>
        <span id="mst-hi-lbl" style="font-size:15px;color:${themeVal('#A0BAD8','#6B7280')};font-weight:700">${maxM}'</span>
      </div>
    </div>
    <div id="mst-stats-tbl"></div>
  </div>`;
  function updateMstStats(tLo,tHi){
    const[g,p,w,fc]=pscore(tLo,tHi);
    const tbl=document.getElementById('mst-stats-tbl');if(!tbl)return;
    const row=(lbl,v0,v1,hl)=>`<div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 0;border-bottom:1px solid ${themeVal('rgba(100,130,200,.1)','rgba(0,0,0,.07)')}${hl?`;background:${themeVal('rgba(80,110,180,.08)','rgba(0,0,0,.04)')}`:''}">
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:${hl?'32':'26'}px;color:${c0};text-align:right;padding-right:16px">${v0}</span>
      <span style="font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;color:${themeVal('#7A94BA','#6B7280')};text-transform:uppercase;text-align:center;white-space:nowrap;min-width:110px">${lbl}</span>
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:${hl?'32':'26'}px;color:${c1};text-align:left;padding-left:16px">${v1}</span>
    </div>`;
    tbl.innerHTML=`<div style="background:${themeVal('rgba(12,22,44,.7)','rgba(240,244,250,.9)')};border:1px solid ${themeVal('rgba(80,110,180,.25)','rgba(0,0,0,.1)')};border-radius:10px;overflow:hidden">
      <div style="display:grid;grid-template-columns:1fr auto 1fr;padding:12px 0 10px;background:${themeVal('rgba(8,16,36,.6)','rgba(230,234,242,.9)')}">
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;letter-spacing:1.5px;color:${c0};text-align:right;padding-right:16px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${teams[0]}</span>
        <span style="min-width:110px;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;color:${themeVal('#5A7090','#6B7280')};text-align:center;text-transform:uppercase">STATS</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;letter-spacing:1.5px;color:${c1};text-align:left;padding-left:16px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${teams[1]}</span>
      </div>
      ${row('GOALS',g[0],g[1])}
      ${row('POINTS',p[0],p[1])}
      ${row('SCORE',fmtgs(g[0],p[0]),fmtgs(g[1],p[1]),true)}
      ${row('WIDES',w[0],w[1])}
      ${row('FREES CONCEDED',fc[0],fc[1])}
    </div>`;
  }
  function updateMstSlider(){
    const loEl=document.getElementById('mst-lo');const hiEl=document.getElementById('mst-hi');
    if(!loEl||!hiEl)return;
    let lo=parseInt(loEl.value);let hi=parseInt(hiEl.value);
    if(lo>hi){loEl.value=hi;lo=hi;}
    if(hi<lo){hiEl.value=lo;hi=lo;}
    lo=Math.max(0,lo);hi=Math.min(maxM,hi);
    const p1=(lo/maxM)*100;const p2=(hi/maxM)*100;
    const fill=document.getElementById('mst-fill');
    if(fill){fill.style.left=p1+'%';fill.style.right=(100-p2)+'%';}
    const thLo=document.getElementById('mst-th-lo');const thHi=document.getElementById('mst-th-hi');
    if(thLo)thLo.style.left=p1+'%';if(thHi)thHi.style.left=p2+'%';
    const loLbl=document.getElementById('mst-lo-lbl');const hiLbl=document.getElementById('mst-hi-lbl');const rangeLbl=document.getElementById('mst-range-lbl');
    if(loLbl)loLbl.textContent=lo+"'";if(hiLbl)hiLbl.textContent=hi+"'";
    if(rangeLbl)rangeLbl.textContent=(lo===0&&hi===maxM)?'FULL GAME':`${lo}' – ${hi}'`;
    updateMstStats(lo*60,hi*60);
  }
  setTimeout(()=>{
    updateMstSlider();
    const lo=document.getElementById('mst-lo');const hi=document.getElementById('mst-hi');
    if(lo)lo.addEventListener('input',updateMstSlider);
    if(hi)hi.addEventListener('input',updateMstSlider);
    const sliderWrap=lo&&lo.parentElement;
    if(sliderWrap){
      sliderWrap.addEventListener('pointerdown',function(e){
        const r=sliderWrap.getBoundingClientRect();
        const pct=(e.clientX-r.left)/r.width;
        const loPct=parseInt(lo.value)/maxM;
        const hiPct=parseInt(hi.value)/maxM;
        if(Math.abs(pct-loPct)<=Math.abs(pct-hiPct)){lo.style.zIndex=4;hi.style.zIndex=3;}
        else{hi.style.zIndex=4;lo.style.zIndex=3;}
      });
    }
  },80);
}
function drawMomentumChart(canvas,events,scoreLine,c0,c1,tMin,tMax,halfT,markerStyle){
  const dpr=window.devicePixelRatio||1;
  const w=canvas.offsetWidth||600;const h=canvas.offsetHeight||200;
  if(w<10||h<10)return;
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
  const ml=46,mr=14,mt=16,mb=34;
  const cw=w-ml-mr,ch=h-mt-mb;
  const span=Math.max(1,tMax-tMin);
  const diffs=scoreLine.map(p=>p.diff);
  const maxAbs=Math.max(3,...diffs.map(Math.abs));
  const yRange=maxAbs+2;
  const xMap=t=>ml+((t-tMin)/span)*cw;
  const yMap=diff=>mt+ch/2-(diff/yRange)*(ch/2);
  const y0=yMap(0);
  // Background zones
  const gradTop=ctx.createLinearGradient(0,mt,0,y0);
  gradTop.addColorStop(0,hexAlpha(c0,0.18));gradTop.addColorStop(1,hexAlpha(c0,0.03));
  ctx.fillStyle=gradTop;ctx.fillRect(ml,mt,cw,Math.max(0,y0-mt));
  const gradBot=ctx.createLinearGradient(0,y0,0,mt+ch);
  gradBot.addColorStop(0,hexAlpha(c1,0.03));gradBot.addColorStop(1,hexAlpha(c1,0.18));
  ctx.fillStyle=gradBot;ctx.fillRect(ml,y0,cw,mt+ch-y0);
  // Grid
  ctx.strokeStyle='rgba(100,130,200,.07)';ctx.lineWidth=1;
  const yStep=yRange<=6?1:yRange<=12?3:6;
  for(let d=-yRange;d<=yRange;d+=yStep){const y=yMap(d);if(y<mt-1||y>mt+ch+1)continue;ctx.beginPath();ctx.moveTo(ml,y);ctx.lineTo(ml+cw,y);ctx.stroke();}
  const tStepMin=span>3000?10:5;const tStep=tStepMin*60;
  ctx.strokeStyle='rgba(100,130,200,.06)';
  const firstTick=Math.ceil(tMin/tStep)*tStep;
  for(let t=firstTick;t<tMax;t+=tStep){const x=xMap(t);ctx.beginPath();ctx.moveTo(x,mt);ctx.lineTo(x,mt+ch);ctx.stroke();}
  // Halftime marker (full game chart only)
  if(halfT!=null&&halfT>tMin&&halfT<tMax){
    const xHalf=xMap(halfT);
    ctx.strokeStyle='rgba(212,168,32,.3)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(xHalf,mt);ctx.lineTo(xHalf,mt+ch);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(212,168,32,.7)';ctx.font=`bold 9px 'Barlow Condensed'`;ctx.textAlign='center';
    ctx.fillText('HT',xHalf,mt+ch+22);
  }
  // Zero line
  ctx.strokeStyle=themeVal('rgba(255,255,255,.2)','rgba(0,0,0,.18)');ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(ml,y0);ctx.lineTo(ml+cw,y0);ctx.stroke();
  // Y-axis labels
  ctx.fillStyle=themeVal('#5A7090','#9CA3AF');ctx.font=`bold 10px 'Barlow Condensed'`;ctx.textAlign='right';
  for(let d=-yRange;d<=yRange;d+=yStep){const y=yMap(d);if(y<mt+1||y>mt+ch-1)continue;ctx.fillText((d>0?'+':d===0?' ':'')+d,ml-5,y+4);}
  // X-axis labels
  ctx.textAlign='center';ctx.fillStyle=themeVal('#5A7090','#9CA3AF');ctx.font=`bold 10px 'Barlow Condensed'`;
  ctx.fillText(Math.round(tMin/60)+"'",xMap(tMin),mt+ch+20);
  for(let t=firstTick;t<=tMax;t+=tStep){
    const lx=xMap(t);ctx.fillText(Math.round(t/60)+"'",lx,mt+ch+20);
    if(t+tStep>tMax&&t<tMax)ctx.fillText(Math.round(tMax/60)+"'",xMap(tMax),mt+ch+20);
  }
  // Filled area under differential line
  if(scoreLine.length>1){
    ctx.beginPath();ctx.moveTo(xMap(scoreLine[0].t),y0);
    scoreLine.forEach(p=>ctx.lineTo(xMap(p.t),yMap(p.diff)));
    ctx.lineTo(xMap(scoreLine[scoreLine.length-1].t),y0);ctx.closePath();
    ctx.save();ctx.clip();
    const ga=ctx.createLinearGradient(0,mt,0,y0);ga.addColorStop(0,hexAlpha(c0,0.35));ga.addColorStop(1,hexAlpha(c0,0.08));
    ctx.fillStyle=ga;ctx.fillRect(ml,mt,cw,y0-mt);
    const gb=ctx.createLinearGradient(0,y0,0,mt+ch);gb.addColorStop(0,hexAlpha(c1,0.08));gb.addColorStop(1,hexAlpha(c1,0.35));
    ctx.fillStyle=gb;ctx.fillRect(ml,y0,cw,mt+ch-y0);
    ctx.restore();
  }
  // Differential line
  if(scoreLine.length>1){
    ctx.beginPath();scoreLine.forEach((p,i)=>{const x=xMap(p.t),y=yMap(p.diff);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.strokeStyle=themeVal('rgba(255,255,255,.55)','rgba(0,0,0,.4)');ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
  }
  // Fixed type-based lanes (distance from centre line, px):
  // goal → outermost, then 2-pt, point, wide, freeconceded → innermost
  const LANE={goal:60,'2pt':46,point:33,wide:21,freeconceded:11};
  const getLaneKey=e=>e.type==='goal'?'goal':e.type==='point'&&e.is2pt?'2pt':e.type==='point'?'point':e.type==='miss'&&e.outcome==='Wide'?'wide':e.type==='freeconceded'?'freeconceded':'point';
  // Scale lanes so the outermost marker always fits within the chart half-height (leave 10px margin)
  const laneScale=Math.min(1,(ch/2-10)/LANE.goal);
  const getLane=e=>(LANE[getLaneKey(e)]||LANE.point)*laneScale;
  const useFlags=(markerStyle==='flags');
  // Flag drawing helper — always upright, pole at base, rectangular flag above
  function drawFlag(cx,outerY,fillColor,label,labelColor){
    const poleH=10;const flagY=outerY-poleH;const fw=16,fh=11;
    ctx.save();
    ctx.strokeStyle='rgba(210,220,235,.85)';ctx.lineWidth=1.6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(cx,outerY);ctx.lineTo(cx,flagY+fh);ctx.stroke();
    ctx.beginPath();ctx.rect(cx,flagY,fw,fh);
    ctx.fillStyle=fillColor;ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=0.8;ctx.stroke();
    if(label){ctx.fillStyle=labelColor||'#000';ctx.font=`900 7px 'Barlow Condensed'`;ctx.textAlign='center';ctx.fillText(label,cx+fw*0.5,flagY+fh*0.72);}
    ctx.restore();
  }
  events.forEach(e=>{
    const x=xMap(e.t);const sign=e.teamIdx===0?-1:1;
    const lane=getLane(e);
    const outerY=y0+sign*lane;
    if(useFlags){
      if(e.type==='goal'){
        drawFlag(x,outerY,'#2ECC71','G','rgba(0,0,0,.85)');
      } else if(e.type==='point'){
        const fc=e.is2pt?'#F97316':'#FFFFFF';const lbl=e.is2pt?'2':'';
        drawFlag(x,outerY,fc,lbl,'#111');
      } else if(e.type==='miss'&&e.outcome==='Wide'){
        const r=4.5;ctx.strokeStyle='rgba(200,200,200,.75)';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(x-r,outerY-r);ctx.lineTo(x+r,outerY+r);ctx.stroke();
        ctx.beginPath();ctx.moveTo(x+r,outerY-r);ctx.lineTo(x-r,outerY+r);ctx.stroke();
      } else if(e.type==='freeconceded'){
        const r=4.5;ctx.beginPath();
        ctx.moveTo(x,outerY-r);ctx.lineTo(x+r,outerY+r*0.6);ctx.lineTo(x-r,outerY+r*0.6);ctx.closePath();
        ctx.fillStyle='rgba(212,168,32,.65)';ctx.fill();
      }
    } else {
      // DOT MODE — fixed lane position, no stacking
      if(e.type==='goal'){
        const r=7;ctx.beginPath();ctx.arc(x,outerY,r,0,Math.PI*2);
        ctx.fillStyle='#2ECC71';ctx.fill();ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle='rgba(0,0,0,.8)';ctx.font=`900 7px 'Barlow Condensed'`;ctx.textAlign='center';
        ctx.fillText('G',x,outerY+2.5);
      } else if(e.type==='point'){
        const r=e.is2pt?5:4;ctx.beginPath();ctx.arc(x,outerY,r,0,Math.PI*2);
        ctx.fillStyle=e.is2pt?'#F97316':'#FFFFFF';ctx.fill();ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=0.8;ctx.stroke();
        if(e.is2pt){ctx.fillStyle='#000';ctx.font=`bold 6px 'Barlow Condensed'`;ctx.textAlign='center';ctx.fillText('2',x,outerY+2.5);}
      } else if(e.type==='miss'&&e.outcome==='Wide'){
        const r=4.5;ctx.strokeStyle='rgba(200,200,200,.75)';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(x-r,outerY-r);ctx.lineTo(x+r,outerY+r);ctx.stroke();
        ctx.beginPath();ctx.moveTo(x+r,outerY-r);ctx.lineTo(x-r,outerY+r);ctx.stroke();
      } else if(e.type==='freeconceded'){
        const r=4.5;ctx.beginPath();
        ctx.moveTo(x,outerY-r);ctx.lineTo(x+r,outerY+r*0.6);ctx.lineTo(x-r,outerY+r*0.6);ctx.closePath();
        ctx.fillStyle='rgba(212,168,32,.65)';ctx.fill();
      }
    }
  });
  // Team labels
  ctx.font=`bold 9px 'Barlow Condensed'`;ctx.textAlign='left';
  ctx.fillStyle=hexAlpha(c0,0.65);ctx.fillText(teams[0]+' ahead',ml+4,mt+9);
  ctx.fillStyle=hexAlpha(c1,0.65);ctx.fillText(teams[1]+' ahead',ml+4,mt+ch-5);
  // Border
  ctx.strokeStyle='rgba(100,130,200,.15)';ctx.lineWidth=1;
  ctx.strokeRect(ml,mt,cw,ch);
}
